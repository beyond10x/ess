paths:
  /email/commands/SendEmail:
    post:
      operationId: billing.email.SendEmail
      summary: SendEmail
      tags:
      - email
      parameters:
      - name: Idempotency-Key
        in: header
        description: '`notify-on-invoice-created` invokes this command with `delivery: at_least_once`, so it may arrive more than once for one cause. The key names the invocation, so a repeat can be recognised as the same one rather than performed again. It is required rather than optional because a retrying caller could otherwise omit it, and the declared guarantee would have no mechanism behind it.'
        required: true
        schema:
          minLength: 1
          type: string
      requestBody:
        description: The input `billing.email.SendEmail` declares.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/billing.email.SendEmail.Input'
      responses:
        '202':
          description: 'Outcome `sent`: the branch the specification declares for this input. Events this branch emits are published to consumers and listed under `published`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/billing.email.SendEmail.sent.Response'
        '501':
          description: 'No declared outcome: the realization is unfinished. Either a port this command runs reported an unmet obligation, and nothing was written: `committed` is `false`. Or the command''s effect was committed and delivering what this command published to a binding failed: `committed` is `true`, the effect and its events stand, and each binding whose delivery failed keeps its event and is attempted again on a later delivery, while no other binding receives it twice. Do not retry: after a failed delivery a retry performs the command a second time.'
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  committed:
                    description: '`true` when the command''s effect and events were committed and delivering what it published failed; `false` when an unmet obligation stopped the command before anything was written.'
                    type: boolean
                  refused:
                    description: What was left unfinished, in words.
                    type: string
                required:
                - refused
                - committed
                type: object
        '502':
          description: 'Outcome `failed`: something outside the request refused. The input was acceptable, so the caller has nothing to correct and a retry is meaningful.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/billing.email.SendEmail.failed.Response'
