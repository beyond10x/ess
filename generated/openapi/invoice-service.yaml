    billing.invoice.CancelInvoice.cancelled.Response:
      additionalProperties: false
      description: The invoice is cancelled, from Draft or from Issued. Taken when no other outcome's condition matched. A `billing.invoice.Invoice` has moved to `Cancelled`, along `cancel`. The instance is the one `invoice_id` names. Emits `InvoiceCancelled`, published to consumers rather than returned here.
      properties:
        outcome:
          const: cancelled
          description: Which declared outcome the command took.
      required:
      - outcome
      type: object
