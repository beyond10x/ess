      additionalProperties: false
      description: The invoice is already Paid or already Cancelled, so nothing was cancelled. Taken when the subject is in a state none of this command's declared moves start from. Which states those are is the lifecycle's answer, not this command's.
      properties:
        error:
          const: billing.invoice.InvoiceStateConflict
          description: The invoice is not in a state this command acts from, so nothing moved.
          type: string
        outcome:
          const: wrong-state
          description: Which declared outcome the command took.
        payload:
          $ref: '#/components/schemas/billing.invoice.InvoiceStateConflict.Error'
