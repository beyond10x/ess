[package]
name = "billing-web"
description = "The `billing` system, v3, behind a WebAssembly boundary: JSON in, JSON out, and the catalogue a page renders itself from."
version = "3.0.0"
edition = "2021"

# Both, and both are used. `cdylib` is what a browser instantiates. `rlib` is what a host crate links against to install its own realization — the exports below travel into that host's own `cdylib`, so a realized module and this one answer the same page.
[lib]
crate-type = ["cdylib", "rlib"]

# Path dependencies into the Rust target's committed tree, and no third party at all: `cargo build` inside this tree is a gate step, and a step that resolves a crate is a step that reaches the network.
[dependencies]
billing-system = { path = "../../../../rust/billing/crates/billing-system" }
billing-types = { path = "../../../../rust/billing/crates/billing-types" }
email-service = { path = "../../../../rust/billing/crates/email-service" }
invoice-service = { path = "../../../../rust/billing/crates/invoice-service" }
