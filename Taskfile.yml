version: '3'

tasks:
  fmt-check:
    cmds:
      # Generated Rust is a byte-pinned projection, not formatter input. Name every workspace
      # member explicitly so a newer rustfmt cannot silently rewrite historical generated bytes.
      - >-
        cargo fmt
        --package billing-realization
        --package ess-cli
        --package ess-compiler
        --package ess-conformance
        --package ess-diff
        --package ess-domain
        --package ess-gen
        --package ess-kubernetes
        --package ess-openapi
        --package ess-primitives
        --package ess-synth
        --package ess-xtask
        --package gatepass-realization
        --package infra-analyze
        --package infra-compiler
        --package infra-domain
        --package infra-project
        --package infra-spec
        --package schema-contract
        -- --check

  clippy:
    cmds:
      - cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    cmds:
      - cargo test --workspace --locked

  doc-check:
    env:
      RUSTDOCFLAGS: -D warnings
    cmds:
      - cargo doc --workspace --no-deps --locked

  example-check:
    cmds:
      - cargo run --quiet --locked --bin ess -- validate --path examples/billing
      - cargo run --quiet --locked --bin ess -- validate --path examples/gatepass
      - cargo run --quiet --locked --bin ess -- validate --path examples/oracle-fixture
      - cargo run --quiet --locked --bin ess -- import kubernetes --path examples/k3d-dev-cluster/observation.json --format json
      - cargo run --quiet --locked --bin ess -- import openapi --path generated/openapi/invoice-service.yaml --format json

  release-check:
    cmds:
      - cargo xtask release verify

  check:
    cmds:
      - task: fmt-check
      - task: clippy
      - task: test
      - task: doc-check
      - task: example-check
      - task: release-check
