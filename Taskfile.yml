version: '3'

tasks:
  fmt-check:
    cmds:
      # Generated Rust is a byte-pinned projection, not formatter input. Name every workspace
      # member explicitly so a newer rustfmt cannot silently rewrite historical generated bytes.
      - >-
        cargo fmt
        --package billing-realization
        --package ess-cli
        --package ess-compiler
        --package ess-conformance
        --package ess-diff
        --package ess-domain
        --package ess-gen
        --package ess-kubernetes
        --package ess-openapi
        --package ess-primitives
        --package ess-synth
        --package ess-xtask
        --package gatepass-realization
        --package infra-analyze
        --package infra-compiler
        --package infra-domain
        --package infra-project
        --package infra-spec
        --package schema-contract
        -- --check

  clippy:
    cmds:
      - cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    cmds:
      - cargo test --workspace --locked

  doc-check:
    env:
      RUSTDOCFLAGS: -D warnings
    cmds:
      - cargo doc --workspace --no-deps --locked

  example-check:
    cmds:
      - cargo run --quiet --locked --bin ess -- validate --path examples/billing
      - cargo run --quiet --locked --bin ess -- validate --path examples/gatepass
      - cargo run --quiet --locked --bin ess -- validate --path examples/oracle-fixture
      - cargo run --quiet --locked --bin ess -- import kubernetes --path examples/k3d-dev-cluster/observation.json --format json
      - cargo run --quiet --locked --bin ess -- import openapi --path generated/openapi/invoice-service.yaml --format json

  release-check:
    cmds:
      - cargo xtask release verify

  site-lab:
    desc: Build and exercise the WebAssembly module used by the public browser lab.
    cmds:
      - cmp generated/web/billing/bridge.js website/src/pages/lab/_bridge.mjs
      - cargo build --release --target wasm32-unknown-unknown --manifest-path examples/billing-web/Cargo.toml
      - mkdir -p website/static/lab
      - cp examples/billing-web/target/wasm32-unknown-unknown/release/billing_web_realized.wasm website/static/lab/billing_web_realized.wasm
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON website/src/pages/lab/_run.test.mjs

  site-build:
    desc: Install the pinned public-doc dependencies, exercise the browser lab, and build Docusaurus.
    cmds:
      - task: site-lab
      - npm --prefix website ci
      - npm --prefix website run build

  check:
    cmds:
      - task: fmt-check
      - task: clippy
      - task: test
      - task: doc-check
      - task: example-check
      - task: release-check
