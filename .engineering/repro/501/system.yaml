format: ess/23
system: catalog
version: v1
domain: catalog.orders

components:
  - component: orders-server
    owns:
      domains: [catalog.orders]
    accepts:
      commands: [catalog.orders.Place]
    reached_by: network

errors:
  - name: catalog.orders.TooManyReferences
  - name: catalog.orders.NoReference

commands:
  - name: catalog.orders.Place
    input:
      - {name: item_code, type: Optional<String>}
      - {name: item_sku, type: Optional<String>}
      - {name: item_url, type: Optional<String>}
    outcomes:
      - name: too-many
        when:
          any:
            - all: [{item_code: {defined: true}}, {item_sku: {defined: true}}]
            - all: [{item_code: {defined: true}}, {item_url: {defined: true}}]
            - all: [{item_sku: {defined: true}}, {item_url: {defined: true}}]
        error: catalog.orders.TooManyReferences
      - name: none-given
        when:
          all: [{item_code: {defined: false}}, {item_sku: {defined: false}}, {item_url: {defined: false}}]
        error: catalog.orders.NoReference
      - name: placed
        accepts: nothing
