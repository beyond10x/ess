domain: gap.demo
entities:
- name: gap.demo.Parent
  identity:
    name: id
    type: String
  fields:
  - name: name
    type: String
  lifecycle:
    initial: Open
    states:
    - Open
    terminal:
    - Open
- name: gap.demo.Item
  identity:
    name: id
    type: String
  fields:
  - name: title
    type: String
  - name: parent_id
    type: String
  - name: n
    type: Integer
  - name: tags
    type: List<String>
  - name: due
    type: Optional<Timestamp>
  - name: note
    type: Optional<String>
  relations:
  - name: parent
    kind: references
    target: gap.demo.Parent
    cardinality: one
    via: parent_id
  lifecycle:
    initial: Open
    states:
    - Open
    - Done
    terminal:
    - Done
    transitions:
    - name: finish
      from:
      - Open
      to: Done
- name: gap.demo.Session
  identity:
    name: id
    type: String
  fields:
  - name: label
    type: String
  lifecycle:
    initial: Idle
    states:
    - Idle
    - Running
    - Paused
    - Waiting
    terminal:
    - Running
    - Paused
    - Waiting
    transitions:
    - name: run
      from:
      - Idle
      to: Running
    - name: pause
      from:
      - Idle
      to: Paused
    - name: wait
      from:
      - Idle
      to: Waiting
events:
- name: gap.demo.ParentCreated
  fields:
  - name: id
    type: String
- name: gap.demo.ItemCreated
  fields:
  - name: id
    type: String
- name: gap.demo.ItemFinished
  fields:
  - name: id
    type: String
- name: gap.demo.SessionChanged
  fields:
  - name: id
    type: String
errors:
- name: gap.demo.NoSuchItem
  fields:
  - name: id
    type: String
commands:
- name: gap.demo.CreateParent
  input:
  - name: id
    type: String
  - name: name
    type: String
  outcomes:
  - name: created
    creates: gap.demo.Parent
    instance: id
    sets:
      name: input.name
    emits:
    - gap.demo.ParentCreated
    payload:
      gap.demo.ParentCreated:
        id: input.id
- name: gap.demo.CreateItem
  input:
  - name: id
    type: String
  - name: title
    type: String
  - name: parent_id
    type: String
  - name: n
    type: Integer
  - name: tags
    type: List<String>
  - name: due
    type: Optional<Timestamp>
  - name: note
    type: Optional<String>
  outcomes:
  - name: created
    creates: gap.demo.Item
    instance: id
    sets:
      title: input.title
      parent_id: input.parent_id
      n: input.n
      tags: input.tags
      due: input.due
      note: input.note
    emits:
    - gap.demo.ItemCreated
    payload:
      gap.demo.ItemCreated:
        id: input.id
- name: gap.demo.FinishItem
  input:
  - name: id
    type: String
  outcomes:
  - name: finished
    moves: gap.demo.Item.finish
    instance: id
    emits:
    - gap.demo.ItemFinished
    payload:
      gap.demo.ItemFinished:
        id: input.id
  - name: unknown
    unknown_instance: true
    error: gap.demo.NoSuchItem
    payload:
      gap.demo.NoSuchItem:
        id: input.id
  - name: wrong-state
    wrong_state: true
    error: gap.demo.NoSuchItem
    payload:
      gap.demo.NoSuchItem:
        id: input.id
- name: gap.demo.OpenSession
  input:
  - name: id
    type: String
  - name: label
    type: String
  outcomes:
  - name: opened
    creates: gap.demo.Session
    instance: id
    sets:
      label: input.label
    emits: &id001
    - gap.demo.SessionChanged
    payload: &id002
      gap.demo.SessionChanged:
        id: input.id
- name: gap.demo.RunSession
  input:
  - name: id
    type: String
  outcomes:
  - name: ran
    moves: gap.demo.Session.run
    instance: id
    emits: *id001
    payload: *id002
  - name: unknown
    unknown_instance: true
    error: gap.demo.NoSuchItem
    payload:
      gap.demo.NoSuchItem:
        id: input.id
  - name: wrong-state
    wrong_state: true
    error: gap.demo.NoSuchItem
    payload:
      gap.demo.NoSuchItem:
        id: input.id
- name: gap.demo.PauseSession
  input:
  - name: id
    type: String
  outcomes:
  - name: paused
    moves: gap.demo.Session.pause
    instance: id
    emits: *id001
    payload: *id002
  - name: unknown
    unknown_instance: true
    error: gap.demo.NoSuchItem
    payload:
      gap.demo.NoSuchItem:
        id: input.id
  - name: wrong-state
    wrong_state: true
    error: gap.demo.NoSuchItem
    payload:
      gap.demo.NoSuchItem:
        id: input.id
- name: gap.demo.WaitSession
  input:
  - name: id
    type: String
  outcomes:
  - name: waiting
    moves: gap.demo.Session.wait
    instance: id
    emits: *id001
    payload: *id002
  - name: unknown
    unknown_instance: true
    error: gap.demo.NoSuchItem
    payload:
      gap.demo.NoSuchItem:
        id: input.id
  - name: wrong-state
    wrong_state: true
    error: gap.demo.NoSuchItem
    payload:
      gap.demo.NoSuchItem:
        id: input.id
views:
- name: gap.demo.Items
  source: gap.demo.Item
  consistency: read_your_writes
  fields:
  - name: id
    type: String
  - name: title
    type: String
  - name: n
    type: Integer
  - name: due
    type: Optional<Timestamp>
  - name: note
    type: Optional<String>
  - name: state
    type: gap.demo.Item.State
- name: gap.demo.Sessions
  source: gap.demo.Session
  consistency: read_your_writes
  fields:
  - name: id
    type: String
  - name: label
    type: String
  - name: state
    type: gap.demo.Session.State
- name: gap.demo.SessionTotals
  source: gap.demo.Session
  consistency: eventual
  fields:
  - name: running
    type: Integer
    aggregate:
      count: {}
      where: state == Running
  - name: paused
    type: Integer
    aggregate:
      count: {}
      where: state == Paused
  - name: waiting
    type: Integer
    aggregate:
      count: {}
      where: state == Waiting
  - name: idle
    type: Integer
    aggregate:
      count: {}
      where: state == Idle
actors:
- name: gap.demo.Anyone
  may:
  - gap.demo.CreateParent
  - gap.demo.CreateItem
  - gap.demo.FinishItem
  - gap.demo.Items
  - gap.demo.OpenSession
  - gap.demo.RunSession
  - gap.demo.PauseSession
  - gap.demo.WaitSession
  - gap.demo.SessionTotals
  - gap.demo.Sessions
