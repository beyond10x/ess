format: ess-ui/1
app: shop
title: Shop
model: shop
placement_profile: fat
fixtures: {dir: fixtures, index: fixtures/index.yaml}
shells: {app: {regions: {main: {kind: page_outlet}}}}
navigation: {home: home, sections: [{name: all, pages: [home, detail]}]}
pages:
  home:
    kind: detail_page
    title: Home
    sections:
      - {name: rows, component: collection, reads: {view: shop.channel.Items, key: item_id}, columns: [label, kind]}
  detail:
    kind: detail_page
    title: Detail
    params:
      id: NoSuchId
      other: {optional: NoSuchId}
      ok: ItemId
    state:
      picked: {type: NoSuchId, class: selection}
    sections:
      - {name: rows, component: collection, reads: {view: shop.channel.Items, key: item_id}, columns: [label, kind]}
