[workspace]
resolver = "2"
members = [
    "crates/ess-cli",
    "crates/ess-primitives",
    "crates/ess-domain",
    "crates/ess-compiler",
    "crates/ess-composition",
    "crates/ess-realization",
    "crates/ess-deployment",
    "crates/ess-gen",
    "crates/ess-conformance",
    "crates/ess-diff",
    "crates/ess-synth",
    "crates/ess-kubernetes",
    "crates/ess-openapi",
    "crates/ess-xtask",
    "crates/infra-domain",
    "crates/infra-compiler",
    "crates/infra-analyze",
    "crates/infra-spec",
    "crates/infra-project",
    "crates/schema-contract",
    "examples/billing-realization",
    "examples/gatepass-realization",
]
exclude = [
    "generated/rust/billing",
    "generated/rust/gatepass",
    "generated/web/billing",
    "examples/billing-web",
]

[workspace.package]
version = "0.9.2"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/beyond10x/ess"
authors = ["Beyond10x contributors"]
publish = false

[workspace.dependencies]
ess-primitives = { path = "crates/ess-primitives", version = "0.9.2" }
ess-domain = { path = "crates/ess-domain", version = "0.9.2" }
ess-compiler = { path = "crates/ess-compiler", version = "0.9.2" }
ess-composition = { path = "crates/ess-composition", version = "0.9.2" }
ess-realization = { path = "crates/ess-realization", version = "0.9.2" }
ess-deployment = { path = "crates/ess-deployment", version = "0.9.2" }
ess-gen = { path = "crates/ess-gen", version = "0.9.2" }
ess-conformance = { path = "crates/ess-conformance", version = "0.9.2" }
ess-diff = { path = "crates/ess-diff", version = "0.9.2" }
ess-synth = { path = "crates/ess-synth", version = "0.9.2" }
ess-kubernetes = { path = "crates/ess-kubernetes", version = "0.9.2" }
ess-openapi = { path = "crates/ess-openapi", version = "0.9.2" }
infra-domain = { path = "crates/infra-domain", version = "0.9.2" }
infra-compiler = { path = "crates/infra-compiler", version = "0.9.2" }
infra-analyze = { path = "crates/infra-analyze", version = "0.9.2" }
infra-spec = { path = "crates/infra-spec", version = "0.9.2" }
infra-project = { path = "crates/infra-project", version = "0.9.2" }
schema-contract = { path = "crates/schema-contract", version = "0.9.2" }
semver = { version = "1", features = ["serde"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = "0.8"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
# CommonMark to the document IR, for content an adopter wrote: a `README.md` beside the model, a
# plan board another tool rendered. Parsing *input* into the IR is the opposite of the round trip
# this layer exists to remove — nothing here re-reads bytes this crate produced.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
