name: Package

on:
  push:
    branches: ['queue/**']
  workflow_call:
    inputs:
      ref:
        description: Exact commit to package.
        required: true
        type: string
      version:
        description: Bare version tag the archives are published under.
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  candidate:
    name: Release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ inputs.version == '' }}
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: ${{ inputs.version == '' }}

      - name: Name the release this commit would publish
        id: version
        shell: bash
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED" ]; then
            echo "version=$REQUESTED" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "ess-cli") | .version')
          if git rev-parse --quiet --verify "refs/tags/$version" > /dev/null; then
            echo "$version is tagged already; nothing to prebuild"
            exit 0
          fi
          if ! cargo xtask release verify "$version"; then
            echo "$version is not a dated release; nothing to prebuild"
            exit 0
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    name: Package ${{ matrix.target }}
    needs: candidate
    if: ${{ needs.candidate.outputs.version != '' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15
          - target: aarch64-apple-darwin
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch' || github.event_name == 'pull_request' }}

      - name: Provide Rosetta for the Intel smoke run
        if: ${{ matrix.target == 'x86_64-apple-darwin' }}
        run: |
          if ! /usr/bin/arch -x86_64 /usr/bin/true 2> /dev/null; then
            sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
          /usr/bin/arch -x86_64 /usr/bin/true

      - name: Build and smoke-test the binary
        shell: bash
        env:
          TAG: ${{ needs.candidate.outputs.version }}
          TAGGED: ${{ inputs.version != '' }}
          TARGET: ${{ matrix.target }}
          EXPECTED_COMMIT: ${{ inputs.ref || github.sha }}
        run: |
          set -euo pipefail
          cargo xtask release verify "$TAG"
          head_commit=$(git rev-parse HEAD)
          if [ "$head_commit" != "$EXPECTED_COMMIT" ]; then
            echo "::error::packaging $EXPECTED_COMMIT, but the checkout is $head_commit" >&2
            exit 1
          fi
          if [ "$TAGGED" = true ]; then
            git cat-file -e "refs/tags/$TAG^{tag}"
            tag_commit=$(git rev-parse "refs/tags/$TAG^{commit}")
            if [ "$tag_commit" != "$EXPECTED_COMMIT" ]; then
              echo "::error::release resolved to $EXPECTED_COMMIT, and tag $TAG now points to $tag_commit" >&2
              exit 1
            fi
          fi
          cargo build --locked --release --bin ess --target "$TARGET"
          bin="target/$TARGET/release/ess"
          case "$TARGET" in
            x86_64-apple-darwin) expected=x86_64 ;;
            aarch64-apple-darwin) expected=arm64 ;;
            *) expected="" ;;
          esac
          if [ -n "$expected" ] && [ "$(lipo -archs "$bin")" != "$expected" ]; then
            echo "::error::$bin is $(lipo -archs "$bin"), not $expected" >&2
            exit 1
          fi
          "$bin" --help > /dev/null
          printed=$("$bin" --version | awk '{print $NF}')
          if [ "$printed" != "$TAG" ]; then
            echo "::error::the built binary reports $printed, but the release is $TAG" >&2
            exit 1
          fi

      - name: Package
        shell: bash
        env:
          TAG: ${{ needs.candidate.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          package="ess-$TAG-$TARGET"
          mkdir -p "dist/$package"
          cp "target/$TARGET/release/ess" "dist/$package/"
          cp LICENSE README.md "dist/$package/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
