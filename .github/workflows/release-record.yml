# Answers one question about the repository itself: does every pushed version tag have a GitHub
# Release behind it? A version tag is what an install instruction names, so a tag with nothing
# published for it promises a download nobody can make.
#
# 0.5.0 is why this exists. The tag was pushed, `task site-build` failed in the release run that
# followed it, publication was skipped, and the repository carried the tag with no way to say so:
# the failing run notified the bot that had pushed the tag, and no other reader.
#
# Retracting the stranded tag from here is not possible. The `b10x-bot-tag-authority` ruleset
# refuses tag creation, update and deletion to every actor except one App, and a workflow holds the
# Actions token rather than that App's. So this reports, and a maintainer publishes or deletes.
#
# It runs when the organization bot publishes a release, after a failed release preparation, and
# daily. A successful preparation is awaiting publication rather than a final failure; the daily
# run still catches every tag stranded before publication.
name: Release record

on:
  release:
    types: [published]
  workflow_run:
    workflows: [Release preparation]
    types: [completed]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: release-record
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  record:
    name: Every version tag has a release
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-record
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch' || github.event_name == 'pull_request' }}

      # The check reads the remote's tags and GitHub's releases, so it cannot live in the offline
      # gate. A failed preparation needs an immediate report; a successful one is deliberately
      # skipped until the bot publishes or the daily stranded-tag check runs.
      - name: Every pushed version tag has a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release status
