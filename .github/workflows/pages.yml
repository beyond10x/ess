# Atlas-classified former Pages workflow: repository-owned validation only; deployment authority is forbidden.
# Preserves the Docusaurus and browser-lab build, including its Rust/WASM and task-toolchain gates.
name: Documentation validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.25.10"
          cache: false

      - name: Install the pinned task runner
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.52.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build the public documentation and browser lab
        run: task site-build

      # The built site, for `beyond10x/website` `project-site.yml` to deploy to this repository's
      # project Pages. Nothing here deploys anything and nothing here holds a credential: the
      # artifact is bound to this run, and the publisher selects the run by the commit it is
      # publishing. `b10x-site.json` is this build's own declaration of what it built, which the
      # publisher refuses on mismatch — a site built for another base path deploys without error
      # and answers 404 for every asset.
      - name: Declare what was built
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail
          mkdir -p website/build/.well-known
          printf '{"schema":"b10x-project-site/v1","repository":"ess","commit":"%s","baseUrl":"/ess/"}\n' \
            "$GITHUB_SHA" > website/build/.well-known/b10x-site.json

      - name: Upload the built site
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: b10x-project-site
          path: website/build
          # `.well-known/b10x-site.json` is what the publisher refuses on, and `.nojekyll` is what
          # keeps Pages from reprocessing the build. Both start with a dot, and this action drops
          # dot-entries unless told otherwise, so the first publish arrived without either.
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
