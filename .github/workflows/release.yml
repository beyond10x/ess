# Cuts a GitHub Release for every version tag: the gate first — `ci.yml` itself, called rather than
# copied, so a tag cannot ship against a shorter gate than main does — then one release whose notes
# are the tag's own section of CHANGELOG.md.
#
# Tags are the bare version (`0.1.0`, atlas § Naming).
#
# No binaries are attached in the initial release. The `ess` command is built from source; adding
# verified platform archives later is a separate release-policy change.
#
# Every action is pinned by commit: the release job holds a token that can publish, and a retargeted
# mutable tag would run inside it.
name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish the release
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-notes

      # Notes come from the matching dated changelog section. The Rust helper refuses a missing,
      # empty, undated, or version-mismatched release before GitHub is mutated.
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cargo xtask release verify "$TAG"
          cargo xtask release notes "$TAG" > notes.md
          cat notes.md

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
