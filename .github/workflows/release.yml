# Prepares a verified release artifact for every version tag. The reusable gate, WASM correctness
# checks and native packages run concurrently at one resolved commit; preparation requires all
# three. The gate is skipped only when the checks the ruleset requires — `Gate` and the two
# `Output ownership (…)` witnesses — already passed on the tagged tree in a qualifying run of this
# repository's `ci.yml`: on the commit itself, or on the queue head it merged, whose pull-request
# run `ci.yml` runs in full (the `prior-gate` step states the whole condition). The native
# packages are reused from that head's `package.yml` run when it holds all four.
# A trusted coordinator publishes the artifact with the organization bot after this workflow.
# Atlas observes that published release and documentation bundles asynchronously.
#
# Tags are the bare version (`0.1.0`, atlas § Naming).
#
# A manual dispatch backfills an existing tag. Every checkout and the reusable gate receive that
# tag explicitly; the workflow file may come from a newer `main`, but no newer source is packaged.
#
# Every action is pinned by commit: a retargeted mutable tag would run inside the preparation job.
name: Release preparation

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing bare version tag to backfill, for example 0.5.1.
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve:
    name: Resolve the release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Read-only: the prior-gate step asks for `Gate` check-runs, their workflow runs and the pull
      # request a merge commit closed; the prebuilt step for `package.yml` runs and artifacts.
      actions: read
      checks: read
      pull-requests: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      gate-passed: ${{ steps.prior-gate.outputs.passed }}
      head: ${{ steps.prior-gate.outputs.head }}
      prebuilt-run: ${{ steps.prebuilt.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Pin the annotated bare-version tag to one commit
        id: release
        shell: bash
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag must be a bare semantic version; got $TAG" >&2
            exit 1
          fi
          git cat-file -e "refs/tags/$TAG^{tag}"
          commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          if [ "$(git rev-parse HEAD)" != "$commit" ]; then
            echo "::error::the checkout does not match tag $TAG at $commit" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      # The gate has usually run on these exact bytes already, so the checks the ruleset requires
      # — `Gate` and the two `Output ownership (…)` witnesses — are reused instead of paid for
      # twice. Of a commit's check-runs of one name, newest first, the first whose workflow run
      # qualifies decides, and only a completed success passes. A run qualifies when it is this
      # repository's `ci.yml` at that commit and archived every feature-off case: a push or
      # schedule run of `main`, or a pull-request run of a `queue/` head (a pull request from any
      # other head or from a fork, and a merge-group run, are narrowed and never count). The gate
      # is skipped when either holds:
      #
      # 1. the tagged commit passed every required check — normally in the `main` push run;
      # 2. the tagged commit is the merge commit of exactly one merged pull request of this
      #    repository into `main`, that pull request's head is its second parent and has its tree,
      #    `main` before the merge (the first parent) is in the head's history, and the head passed
      #    every required check — normally in its queue pull-request run.
      #
      # The tree equality is what makes 2 honest: the tested bytes are the tagged bytes. The
      # ancestry is what makes the head's run a test of them — a `pull_request` run tests the head
      # merged into the base of its day, which is the head's own tree only when that base was
      # already in the head. Anything else — a backfill, no check-run from a qualifying run among
      # the newest ten, a failure, one still running, more than one page of check-runs, a squash,
      # an API error — runs the gate below as before. The head is reported whenever its tree is
      # the tagged tree, so the prebuilt step can be keyed on it. `ci_lanes.rs` runs this script
      # against real Git histories.
      - name: Look for the required checks passed on the tagged tree
        id: prior-gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail
          head=""
          number=""
          required=("Gate" "Output ownership (macos-15)" "Output ownership (macos-15-intel)")
          decide() {
            echo "$2"
            echo "passed=$1" >> "$GITHUB_OUTPUT"
            echo "head=$head" >> "$GITHUB_OUTPUT"
            exit 0
          }
          # 0 when workflow run $1 qualifies as a full run of commit $2: this repository's ci.yml
          # at that commit, as a push or schedule run of main or a pull-request run of a queue/
          # head. 2 when the run cannot be read.
          qualifies() {
            local described path event branch repository sha
            described=$(gh api "repos/$REPOSITORY/actions/runs/$1" \
                --jq '"\(.path) \(.event) \(.head_branch // "-") \(.head_repository.full_name // "-") \(.head_sha)"') \
              || { echo "workflow run $1 is unavailable"; return 2; }
            echo "workflow run $1: $described"
            read -r path event branch repository sha <<< "$described"
            [ "$path" = ".github/workflows/ci.yml" ] || return 1
            [ "$repository" = "$REPOSITORY" ] || return 1
            [ "$sha" = "$2" ] || return 1
            case "$event" in
              push|schedule) [ "$branch" = main ] ;;
              pull_request) [[ "$branch" == queue/* ]] ;;
              *) return 1 ;;
            esac
          }
          # 0 when the check named $2 passed on commit $1 ($3 in the log) in a qualifying run: of
          # its check-runs newest first, the first whose workflow run qualifies decides, and only a
          # completed success passes. At most ten workflow runs are read.
          check_passed() {
            local listing status url run seen=0 rc
            listing=$(NAME="$2" gh api "repos/$REPOSITORY/commits/$1/check-runs?check_name=${2// /%20}&filter=all&per_page=100" --jq '
                if .total_count > 100 then error("\(.total_count) check-runs, more than one page") else . end
                | [.check_runs[] | select(.name == env.NAME and .app.slug == "github-actions")]
                | sort_by(.started_at) | reverse | .[]
                | "\(.status)/\(.conclusion) \(.details_url)"') \
              || { echo "the $2 check-runs of $3 cannot be read (unavailable, or more than one page)"; return 1; }
            [ -n "$listing" ] || { echo "no $2 check-run on $3"; return 1; }
            while read -r status url; do
              if [ "$seen" -ge 10 ]; then
                echo "no qualifying run among the newest ten $2 check-runs of $3"
                return 1
              fi
              seen=$((seen + 1))
              [[ "$url" =~ /actions/runs/([0-9]+)/ ]] \
                || { echo "$2 check-run $url of $3 names no workflow run"; continue; }
              run="${BASH_REMATCH[1]}"
              qualifies "$run" "$1" && rc=0 || rc=$?
              case "$rc" in
                0)
                  echo "$2 on $3: $status, from qualifying run $run"
                  [ "$status" = "completed/success" ] && return 0
                  return 1
                  ;;
                2) return 1 ;;
              esac
            done <<< "$listing"
            echo "no $2 check-run of $3 comes from a qualifying run"
            return 1
          }
          # 0 when every required check passed on commit $1 ($2 in the log) in a qualifying run.
          required_passed() {
            local name
            for name in "${required[@]}"; do
              check_passed "$1" "$name" "$2" || return 1
            done
          }

          if [ "$EVENT" != push ]; then
            decide false "running the gate and building the archives: a $EVENT run reuses nothing"
          fi
          tree=$(git rev-parse --verify --quiet "$COMMIT^{tree}") \
            || decide false "running the gate and building the archives: $COMMIT has no tree"

          pull=$(gh api "repos/$REPOSITORY/commits/$COMMIT/pulls?per_page=100" --jq '
              [.[] | select(.merged_at != null and .merge_commit_sha == env.COMMIT
                  and .base.ref == "main" and .head.repo.full_name == env.REPOSITORY)]
              | if length == 1 then "pr \(.[0].number) \(.[0].head.sha)" else "count \(length)" end') \
            || pull="unavailable"
          case "$pull" in
            "pr "*)
              read -r _ number candidate <<< "$pull"
              if [[ ! "$candidate" =~ ^[0-9a-f]{40}$ ]]; then
                echo "#$number names no head commit ($candidate)"
              elif [ "$(git rev-parse --verify --quiet "$COMMIT^2" || true)" != "$candidate" ]; then
                echo "$COMMIT is not the merge commit of head $candidate of #$number"
              elif [ "$(git rev-parse --verify --quiet "$candidate^{tree}" || true)" != "$tree" ]; then
                echo "head $candidate of #$number does not have the tagged tree $tree"
              else
                head="$candidate"
                echo "#$number merged head $head, whose tree is the tagged tree $tree"
              fi
              ;;
            *) echo "$COMMIT is the merge commit of no single merged pull request of this repository into main ($pull)" ;;
          esac

          if required_passed "$COMMIT" "the tagged commit"; then
            decide true "reusing the required checks passed on the tagged commit"
          fi
          if [ -z "$head" ]; then
            decide false "running the gate: no merged queue head has the tagged tree"
          fi
          if ! git merge-base --is-ancestor "$COMMIT^1" "$head"; then
            decide false "running the gate: main before $COMMIT is not in head $head's history, so no run of #$number tested this tree"
          fi
          if required_passed "$head" "head $head of #$number"; then
            decide true "reusing the required checks passed on head $head of #$number, whose tree is the tagged tree"
          fi
          decide false "running the gate: head $head of #$number did not pass every required check in a qualifying run"

      # The archives are built by `package.yml` on the queue push of the head, never at the merge
      # commit a tag names, so the lookup is keyed on the head `prior-gate` resolved.
      - name: Look for the archives a queue run built from the merged head
        id: prebuilt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD: ${{ steps.prior-gate.outputs.head }}
        run: |
          set -euo pipefail
          decide() {
            echo "$2"
            echo "run=$1" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [[ ! "$HEAD" =~ ^[0-9a-f]{40}$ ]]; then
            decide "" "building the archives: the tagged commit merged no queue head with its tree"
          fi
          runs=$(gh api "repos/$REPOSITORY/actions/workflows/package.yml/runs?head_sha=$HEAD&event=push&status=success&per_page=100" --jq '
              [.workflow_runs[]
                | select(.head_sha == env.HEAD and .path == ".github/workflows/package.yml"
                    and .event == "push" and .conclusion == "success"
                    and (.head_branch | startswith("queue/")))]
              | sort_by(.run_started_at) | reverse | .[] | "\(.id)"') \
            || decide "" "building the archives: the package runs of head $HEAD are unavailable"
          [ -n "$runs" ] || decide "" "building the archives: no successful queue package run built head $HEAD"
          # The newest run that still holds all four archives, unexpired.
          for run in $runs; do
            [[ "$run" =~ ^[0-9]+$ ]] || continue
            held=$(gh api "repos/$REPOSITORY/actions/runs/$run/artifacts?per_page=100" --jq '
                [.artifacts[] | select(.expired == false) | .name] | join(" ")') \
              || { echo "the artifacts of package run $run are unavailable"; continue; }
            missing=""
            for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin; do
              case " $held " in
                *" release-$target "*) ;;
                *) missing="$missing release-$target" ;;
              esac
            done
            if [ -z "$missing" ]; then
              decide "$run" "using the archives package run $run built from head $HEAD"
            fi
            echo "package run $run holds no$missing"
          done
          decide "" "building the archives: no successful queue package run of head $HEAD holds all four archives"

  gate:
    needs: resolve
    if: ${{ needs.resolve.outputs.gate-passed != 'true' }}
    uses: ./.github/workflows/ci.yml
    with:
      checkout-ref: ${{ needs.resolve.outputs.commit }}

  wasm:
    name: Verify the WebAssembly realization
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown

      # The released binary, checked against the release's own `task_checksums.txt`.
      - name: Install the pinned task runner
        env:
          TASK_VERSION: "3.52.0"
          TASK_SHA256: 02c679ffae53dca791804847d78b31731615894e292948397c971c87ac9e95bd
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/task.tar.gz" \
            "https://github.com/go-task/task/releases/download/v$TASK_VERSION/task_linux_amd64.tar.gz"
          echo "$TASK_SHA256  $RUNNER_TEMP/task.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/task-bin"
          tar -xzf "$RUNNER_TEMP/task.tar.gz" -C "$RUNNER_TEMP/task-bin" task
          echo "$RUNNER_TEMP/task-bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch' || github.event_name == 'pull_request' }}

      - name: Build and drive the WebAssembly realization
        run: task web-check

  package:
    needs: resolve
    if: ${{ needs.resolve.outputs.prebuilt-run == '' }}
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}
      version: ${{ needs.resolve.outputs.tag }}

  release:
    name: Prepare the release artifact
    needs: [resolve, gate, wasm, package]
    if: ${{ always() && needs.resolve.result == 'success' && (needs.gate.result == 'success' || (needs.gate.result == 'skipped' && needs.resolve.outputs.gate-passed == 'true')) && needs.wasm.result == 'success' && (needs.package.result == 'success' || (needs.package.result == 'skipped' && needs.resolve.outputs.prebuilt-run != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-notes
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch' || github.event_name == 'pull_request' }}

      # Notes come from the matching dated changelog section. The Rust helper refuses a missing,
      # empty, undated, or version-mismatched release before GitHub is mutated.
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          set -euo pipefail
          cargo xtask release verify "$TAG"
          git cat-file -e "refs/tags/$TAG^{tag}"
          tag_commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_COMMIT" ] || [ "$tag_commit" != "$EXPECTED_COMMIT" ]; then
            echo "::error::tag $TAG moved after this release resolved it to $EXPECTED_COMMIT" >&2
            exit 1
          fi
          cargo xtask release notes "$TAG" > notes.md
          cat notes.md

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ needs.resolve.outputs.prebuilt-run == '' }}
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ needs.resolve.outputs.prebuilt-run != '' }}
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
          run-id: ${{ needs.resolve.outputs.prebuilt-run }}
          github-token: ${{ github.token }}

      - name: Verify and combine checksums
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          cd dist
          archive_count=$(find . -maxdepth 1 -type f -name "*.tar.gz" | wc -l | tr -d ' ')
          if [ "$archive_count" != 4 ]; then
            echo "::error::expected four release archives; found $archive_count" >&2
            exit 1
          fi
          for target in \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            x86_64-apple-darwin \
            aarch64-apple-darwin
          do
            test -f "ess-$TAG-$target.tar.gz" || {
              echo "::error::missing ess-$TAG-$target.tar.gz" >&2
              exit 1
            }
          done
          sha256sum *.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
          cat SHA256SUMS

      - name: Smoke-run the Linux archive prepared for publication
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke"
          tar -xzf "dist/ess-$TAG-x86_64-unknown-linux-gnu.tar.gz" -C "$smoke"
          printed=$("$smoke/ess-$TAG-x86_64-unknown-linux-gnu/ess" --version | awk '{print $NF}')
          if [ "$printed" != "$TAG" ]; then
            echo "::error::the prepared Linux binary reports $printed, but the release tag is $TAG" >&2
            exit 1
          fi

      # The artifact name binds the annotated tag and resolved source commit. Publication happens
      # later from a trusted environment through the organization-bot route described in AGENTS.md.
      - name: Retain the verified release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ess-release-${{ needs.resolve.outputs.tag }}-${{ needs.resolve.outputs.commit }}
          path: |
            dist/ess-${{ needs.resolve.outputs.tag }}-*.tar.gz
            dist/SHA256SUMS
            notes.md
          if-no-files-found: error
          retention-days: 7
