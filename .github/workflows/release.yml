# Cuts a GitHub Release for every version tag: the gate first — `ci.yml` itself, called rather than
# copied, so a tag cannot ship against a shorter gate than main does — then native Linux and macOS
# binaries and one release whose notes are the tag's own section of CHANGELOG.md.
#
# Tags are the bare version (`0.1.0`, atlas § Naming).
#
# A manual dispatch backfills an existing tag. Every checkout and the reusable gate receive that
# tag explicitly; the workflow file may come from a newer `main`, but no newer source is packaged.
#
# Every action is pinned by commit: the release job holds a token that can publish, and a retargeted
# mutable tag would run inside it.
name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing bare version tag to backfill, for example 0.5.1.
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve:
    name: Resolve the release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Pin the annotated bare-version tag to one commit
        id: release
        shell: bash
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag must be a bare semantic version; got $TAG" >&2
            exit 1
          fi
          git cat-file -e "refs/tags/$TAG^{tag}"
          commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          if [ "$(git rev-parse HEAD)" != "$commit" ]; then
            echo "::error::the checkout does not match tag $TAG at $commit" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  gate:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      checkout-ref: ${{ needs.resolve.outputs.commit }}

  website:
    name: Build the public documentation
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.25.10"
          cache: false

      - name: Install the pinned task runner
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.52.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build the public documentation and browser lab
        run: task site-build

  package:
    name: Package ${{ matrix.target }}
    needs: [resolve, gate]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc floor lower than `ubuntu-latest` for downloaded binaries.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          # The explicit Intel label avoids silently changing architecture when `macos-latest`
          # moves. `macos-15` is the standard Apple Silicon runner.
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.target }}

      - name: Build and smoke-test the native binary
        shell: bash
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          TARGET: ${{ matrix.target }}
          EXPECTED_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          set -euo pipefail
          cargo xtask release verify "$TAG"
          tag_commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          head_commit=$(git rev-parse HEAD)
          git cat-file -e "refs/tags/$TAG^{tag}"
          if [ "$head_commit" != "$EXPECTED_COMMIT" ] || [ "$tag_commit" != "$EXPECTED_COMMIT" ]; then
            echo "::error::release resolved to $EXPECTED_COMMIT, checkout is $head_commit, and tag $TAG now points to $tag_commit" >&2
            exit 1
          fi
          cargo build --locked --release --bin ess --target "$TARGET"
          bin="target/$TARGET/release/ess"
          "$bin" --help > /dev/null
          printed=$("$bin" --version | awk '{print $NF}')
          if [ "$printed" != "$TAG" ]; then
            echo "::error::the built binary reports $printed, but the release tag is $TAG" >&2
            exit 1
          fi

      - name: Package
        shell: bash
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          package="ess-$TAG-$TARGET"
          mkdir -p "dist/$package"
          cp "target/$TARGET/release/ess" "dist/$package/"
          cp LICENSE README.md "dist/$package/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [resolve, gate, website, package]
    if: ${{ always() && needs.resolve.result == 'success' && needs.gate.result == 'success' && needs.website.result == 'success' && needs.package.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-notes

      # Notes come from the matching dated changelog section. The Rust helper refuses a missing,
      # empty, undated, or version-mismatched release before GitHub is mutated.
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          set -euo pipefail
          cargo xtask release verify "$TAG"
          git cat-file -e "refs/tags/$TAG^{tag}"
          tag_commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_COMMIT" ] || [ "$tag_commit" != "$EXPECTED_COMMIT" ]; then
            echo "::error::tag $TAG moved after this release resolved it to $EXPECTED_COMMIT" >&2
            exit 1
          fi
          cargo xtask release notes "$TAG" > notes.md
          cat notes.md

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify and combine checksums
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          cd dist
          archive_count=$(find . -maxdepth 1 -type f -name "ess-$TAG-*.tar.gz" | wc -l | tr -d ' ')
          if [ "$archive_count" != 4 ]; then
            echo "::error::expected four release archives; found $archive_count" >&2
            exit 1
          fi
          for target in \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            x86_64-apple-darwin \
            aarch64-apple-darwin
          do
            test -f "ess-$TAG-$target.tar.gz" || {
              echo "::error::missing ess-$TAG-$target.tar.gz" >&2
              exit 1
            }
          done
          sha256sum *.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
          cat SHA256SUMS

      # Idempotent on purpose: a dispatch can backfill a release that already exists, and a rerun
      # after one failed asset upload must reconcile all assets rather than stop at "already exists".
      - name: Create or reconcile the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
          fi
          gh release upload "$TAG" dist/* --clobber
