# Cuts a GitHub Release for every version tag. The reusable gate, WASM correctness checks and
# native packages run concurrently at one resolved commit; publication requires all three. The
# gate is skipped only when a successful `Gate` check-run already covers those exact bytes: on the
# commit itself, or on the head of the pull request it merged when that head has its tree (the
# `prior-gate` step states the whole condition).
# Atlas observes published releases and documentation bundles asynchronously.
#
# Tags are the bare version (`0.1.0`, atlas § Naming).
#
# A manual dispatch backfills an existing tag. Every checkout and the reusable gate receive that
# tag explicitly; the workflow file may come from a newer `main`, but no newer source is packaged.
#
# Every action is pinned by commit: the release job holds a token that can publish, and a retargeted
# mutable tag would run inside it.
name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing bare version tag to backfill, for example 0.5.1.
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve:
    name: Resolve the release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Read-only: the prior-gate step asks for `Gate` check-runs and for the pull request a
      # merge commit closed.
      checks: read
      pull-requests: read
      actions: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      gate-passed: ${{ steps.prior-gate.outputs.passed }}
      prebuilt-run: ${{ steps.prebuilt.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Pin the annotated bare-version tag to one commit
        id: release
        shell: bash
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag must be a bare semantic version; got $TAG" >&2
            exit 1
          fi
          git cat-file -e "refs/tags/$TAG^{tag}"
          commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          if [ "$(git rev-parse HEAD)" != "$commit" ]; then
            echo "::error::the checkout does not match tag $TAG at $commit" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      # The gate has usually run on these exact bytes already, so a green `Gate` is reused instead
      # of paid for twice. It counts when either holds:
      #
      # 1. the tagged commit carries one — normally the `main` push run;
      # 2. the tagged commit is the merge commit of exactly one merged pull request, the commit's
      #    tree is that pull request's head's tree, `main` before the merge (the commit's first
      #    parent) is in the head's history, and the head carries one.
      #
      # The tree equality is what makes 2 honest: the tested bytes are the tagged bytes. The
      # ancestry is what makes the head's `Gate` a test of them — a `pull_request` run tests the
      # head merged into the base of its day, which is the head's own tree only when that base was
      # already in the head. Only the newest `Gate` GitHub Actions itself recorded counts, and only
      # as a completed success. Anything else — none, a failure, one still running, an API or
      # fetch error — runs the gate below as before. `ci_lanes.rs` runs this script against both.
      - name: Look for a green Gate on the tagged bytes
        id: prior-gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail
          newest_gate() {
            gh api "repos/$REPOSITORY/commits/$1/check-runs?check_name=Gate&filter=all&per_page=100" --jq '
              [.check_runs[] | select(.name == "Gate" and .app.slug == "github-actions")]
              | sort_by(.started_at) | last
              | if . == null then "none" else "\(.status)/\(.conclusion) \(.html_url)" end'
          }
          decide() {
            echo "$2"
            echo "passed=$1" >> "$GITHUB_OUTPUT"
            exit 0
          }

          latest=$(newest_gate "$COMMIT") || latest="unavailable"
          echo "newest Gate check-run on $COMMIT: $latest"
          if [ "${latest%% *}" = "completed/success" ]; then
            decide true "reusing the Gate on the tagged commit"
          fi

          pull=$(gh api "repos/$REPOSITORY/commits/$COMMIT/pulls" --jq '
              [.[] | select(.merged_at != null and .merge_commit_sha == env.COMMIT)]
              | if length == 1 then "pr \(.[0].number) \(.[0].head.sha)" else "count \(length)" end') \
            || decide false "running the gate: the pull requests of $COMMIT are unavailable"
          case "$pull" in
            "pr "*) ;;
            *) decide false "running the gate: $COMMIT is the merge commit of no single merged pull request ($pull)" ;;
          esac
          read -r _ number head <<< "$pull"
          if [[ ! "$head" =~ ^[0-9a-f]{40}$ ]]; then
            decide false "running the gate: #$number names no head commit ($head)"
          fi
          git fetch --no-tags --quiet origin "$head" \
            || decide false "running the gate: head $head of #$number cannot be fetched"
          merge_tree=$(git rev-parse --verify --quiet "$COMMIT^{tree}") \
            || decide false "running the gate: $COMMIT has no tree"
          head_tree=$(git rev-parse --verify --quiet "$head^{tree}") \
            || decide false "running the gate: head $head of #$number has no tree"
          if [ "$merge_tree" != "$head_tree" ]; then
            decide false "running the gate: $COMMIT's tree $merge_tree is not head $head's tree $head_tree"
          fi
          if ! git merge-base --is-ancestor "$COMMIT^1" "$head"; then
            decide false "running the gate: main before $COMMIT is not in head $head's history, so no run of #$number tested this tree"
          fi
          head_gate=$(newest_gate "$head") || head_gate="unavailable"
          echo "newest Gate check-run on head $head of #$number: $head_gate"
          if [ "${head_gate%% *}" = "completed/success" ]; then
            decide true "reusing the Gate on head $head of #$number, whose tree is the tagged tree"
          fi
          decide false "running the gate: head $head of #$number has no green Gate"

      - name: Look for the archives a queue run built from the tagged commit
        id: prebuilt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail
          decide() {
            echo "$2"
            echo "run=$1" >> "$GITHUB_OUTPUT"
            exit 0
          }

          run=$(gh api "repos/$REPOSITORY/actions/workflows/package.yml/runs?head_sha=$COMMIT&event=push&status=success&per_page=100" --jq '
              [.workflow_runs[]
                | select(.head_sha == env.COMMIT and .path == ".github/workflows/package.yml"
                    and .event == "push" and .conclusion == "success"
                    and (.head_branch | startswith("queue/")))]
              | sort_by(.run_started_at) | last
              | if . == null then "none" else "\(.id)" end') \
            || decide "" "building the archives: the package runs of $COMMIT are unavailable"
          if [[ ! "$run" =~ ^[0-9]+$ ]]; then
            decide "" "building the archives: no successful queue package run built $COMMIT"
          fi
          held=$(gh api "repos/$REPOSITORY/actions/runs/$run/artifacts?per_page=100" --jq '
              [.artifacts[] | select(.expired == false) | .name] | join(" ")') \
            || decide "" "building the archives: the artifacts of package run $run are unavailable"
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin; do
            case " $held " in
              *" release-$target "*) ;;
              *) decide "" "building the archives: package run $run holds no release-$target" ;;
            esac
          done
          decide "$run" "publishing the archives package run $run built from $COMMIT"

  gate:
    needs: resolve
    if: ${{ needs.resolve.outputs.gate-passed != 'true' }}
    uses: ./.github/workflows/ci.yml
    with:
      checkout-ref: ${{ needs.resolve.outputs.commit }}

  wasm:
    name: Verify the compiler in the browser lab
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown

      # The released binary, checked against the release's own `task_checksums.txt`.
      - name: Install the pinned task runner
        env:
          TASK_VERSION: "3.52.0"
          TASK_SHA256: 02c679ffae53dca791804847d78b31731615894e292948397c971c87ac9e95bd
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/task.tar.gz" \
            "https://github.com/go-task/task/releases/download/v$TASK_VERSION/task_linux_amd64.tar.gz"
          echo "$TASK_SHA256  $RUNNER_TEMP/task.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/task-bin"
          tar -xzf "$RUNNER_TEMP/task.tar.gz" -C "$RUNNER_TEMP/task-bin" task
          echo "$RUNNER_TEMP/task-bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch' || github.event_name == 'pull_request' }}

      - name: Build and verify the WASM compiler and browser lab
        run: task site-lab

  package:
    needs: resolve
    if: ${{ needs.resolve.outputs.prebuilt-run == '' }}
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}
      version: ${{ needs.resolve.outputs.tag }}

  release:
    name: Publish the release
    needs: [resolve, gate, wasm, package]
    if: ${{ always() && needs.resolve.result == 'success' && (needs.gate.result == 'success' || (needs.gate.result == 'skipped' && needs.resolve.outputs.gate-passed == 'true')) && needs.wasm.result == 'success' && (needs.package.result == 'success' || (needs.package.result == 'skipped' && needs.resolve.outputs.prebuilt-run != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-notes
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch' || github.event_name == 'pull_request' }}

      # Notes come from the matching dated changelog section. The Rust helper refuses a missing,
      # empty, undated, or version-mismatched release before GitHub is mutated.
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          set -euo pipefail
          cargo xtask release verify "$TAG"
          git cat-file -e "refs/tags/$TAG^{tag}"
          tag_commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_COMMIT" ] || [ "$tag_commit" != "$EXPECTED_COMMIT" ]; then
            echo "::error::tag $TAG moved after this release resolved it to $EXPECTED_COMMIT" >&2
            exit 1
          fi
          cargo xtask release notes "$TAG" > notes.md
          cat notes.md

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ needs.resolve.outputs.prebuilt-run == '' }}
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ needs.resolve.outputs.prebuilt-run != '' }}
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
          run-id: ${{ needs.resolve.outputs.prebuilt-run }}
          github-token: ${{ github.token }}

      - name: Verify and combine checksums
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          cd dist
          archive_count=$(find . -maxdepth 1 -type f -name "ess-$TAG-*.tar.gz" | wc -l | tr -d ' ')
          if [ "$archive_count" != 4 ]; then
            echo "::error::expected four release archives; found $archive_count" >&2
            exit 1
          fi
          for target in \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            x86_64-apple-darwin \
            aarch64-apple-darwin
          do
            test -f "ess-$TAG-$target.tar.gz" || {
              echo "::error::missing ess-$TAG-$target.tar.gz" >&2
              exit 1
            }
          done
          sha256sum *.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
          cat SHA256SUMS

      - name: Smoke-run the Linux archive that is published
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke"
          tar -xzf "dist/ess-$TAG-x86_64-unknown-linux-gnu.tar.gz" -C "$smoke"
          printed=$("$smoke/ess-$TAG-x86_64-unknown-linux-gnu/ess" --version | awk '{print $NF}')
          if [ "$printed" != "$TAG" ]; then
            echo "::error::the published Linux binary reports $printed, but the release tag is $TAG" >&2
            exit 1
          fi

      # Idempotent on purpose: a dispatch can backfill a release that already exists, and a rerun
      # after one failed asset upload must reconcile all assets rather than stop at "already exists".
      - name: Create or reconcile the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag --draft
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false
