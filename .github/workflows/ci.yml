# CI provisions the complete repository gate and the native macOS ownership witnesses.
# The Taskfile remains the complete gate; macOS exercises the platform-specific protocol.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      checkout-ref:
        description: Exact tag or commit to gate when called by the release workflow.
        required: false
        type: string
        default: ""

concurrency:
  group: ci-${{ inputs.checkout-ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A manual release backfill calls this workflow from `main` but must gate the tagged
          # source, not the branch that happens to contain the backfill-capable workflow.
          ref: ${{ inputs.checkout-ref || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch the annotated release record
        run: git fetch --tags --force --prune origin

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # Consumer coverage binds its initial eligibility to this reviewed compiler profile.
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # go-task 3.52.0 declares this exact minimum. GOTOOLCHAIN is deliberately local below,
          # so the setup version and the pinned task runner must move together.
          go-version: "1.25.10"
          # The generated modules intentionally have no go.sum. setup-go's automatic cache looks
          # for one at the repository root and warns on every release run; Rust's cache below is
          # the cache this mixed-language gate actually relies on.
          cache: false

      - name: Install go-task
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.52.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Run the repository gate
        run: task check

  output-ownership-macos:
    name: Output ownership (${{ matrix.runner }})
    # Branch/PR validation qualifies the new protocol on both shipped macOS architectures.
    # A release backfill can ask this reusable workflow to gate an older source commit that
    # predates this test target; its own Taskfile and native packaging remain authoritative.
    if: ${{ inputs.checkout-ref == '' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Match both native architectures already shipped by the release workflow.
        runner: [macos-15-intel, macos-15]
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_TEST_THREADS: "2"
    steps:
      - name: Prepare native scratch
        run: |
          mkdir -p "$RUNNER_TEMP/ess-ownership"
          echo "TMPDIR=$RUNNER_TEMP/ess-ownership" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Exercise native ownership and interrupted recovery
        run: cargo test --offline --locked -p ess-cli --test output_ownership

      - name: Exercise native repository sync isolation
        run: cargo test --offline --locked -p ess-xtask --bin ess-xtask tests::sync_
