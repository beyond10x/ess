# CI provisions the repository checks, plus native macOS ownership witnesses. Consumer coverage is
# parked (ESS-EVOLUTION.md revision 3) and runs nowhere by default. The Taskfile remains the
# complete gate; macOS exercises the platform-specific protocol.
#
# `task check` runs here as a few jobs, each running Taskfile tasks as steps, and the `Gate` job
# carries their joint result under the required check's name:
#
#   checks             ci-lint, ci-smoke, test-feature-off-doc, test-xtask, fuzz-check, one after another
#   build-tests        test-archive-workspace: the workspace test binaries, compiled once
#   build-feature-off  test-archive-feature-off: the feature-off test binaries, beside it
#   test (m/n)         test-shard and test-feature-off: partition m of each archive, compiling nothing
#
# `crates/edge/ess-xtask/tests/ci_lanes.rs` fails when a step of `task check` runs in no job, when
# the shards leave a partition unrun, or when `Gate` does not carry a job's result.
#
# `msrv` checks every target of the workspace on the `rust-version` `Cargo.toml` declares, which
# downstream repositories compile ESS with; `Gate` carries its result too.
name: CI

on:
  push:
    branches: [main]
  # A queue head runs once, as its pull request; a `queue/**` push runs no `ci.yml`.
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "17 3 * * *"
  workflow_call:
    inputs:
      checkout-ref:
        description: Exact tag or commit to gate when called by the release workflow.
        required: false
        type: string
        default: ""

concurrency:
  # The event is in the key so that the nightly run and a `main` push never cancel each other.
  group: ci-${{ github.event_name }}-${{ inputs.checkout-ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # lld for the Linux host only, and only here: WASM keeps its own linker, and local builds and
  # the shipped release binaries keep the system one. `test-xtask` sets the same flag itself.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-fuse-ld=lld

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A manual release backfill calls this workflow from `main` but must gate the tagged
          # source, not the branch that happens to contain the backfill-capable workflow.
          ref: ${{ inputs.checkout-ref || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch the annotated release record
        run: git fetch --tags --force --prune origin

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # `test-xtask` selects this reviewed compiler through RUSTUP_TOOLCHAIN, and the parked
          # `task consumer-check` binds its initial eligibility to the same profile.
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      # The released binary, checked against the release's own `task_checksums.txt`; compiling it
      # with `go install` cost every job about a minute.
      - name: Install go-task
        env:
          TASK_VERSION: "3.52.0"
          TASK_SHA256: 02c679ffae53dca791804847d78b31731615894e292948397c971c87ac9e95bd
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/task.tar.gz" \
            "https://github.com/go-task/task/releases/download/v$TASK_VERSION/task_linux_amd64.tar.gz"
          echo "$TASK_SHA256  $RUNNER_TEMP/task.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/task-bin"
          tar -xzf "$RUNNER_TEMP/task.tar.gz" -C "$RUNNER_TEMP/task-bin" task
          echo "$RUNNER_TEMP/task-bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: checks
          workspaces: |
            . -> target
            fuzz -> target
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch' || github.event_name == 'pull_request' }}

      # Gate tasks build offline (`fuzz-check`, `support-check`, and cargo runs spawned by the
      # xtask support tests), so both lockfiles are fetched before the first task.
      - name: Fetch locked dependencies
        id: dependencies
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path fuzz/Cargo.toml

      # `projection-check` writes the visualise page's presentation with the `ess-ui` commit
      # `website/package.json` pins. It is installed here, once per pin, so the lanes stay offline.
      - name: Restore the pinned ess-ui
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ess-ui
          key: ess-ui-${{ runner.os }}-${{ hashFiles('website/package.json') }}

      - name: Install the pinned ess-ui
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: cargo xtask ess-ui

      # One setup, then each task in turn. Every task runs whatever the one before it did, so one
      # red run names every failing task rather than the first.
      - name: Lint (fmt, Clippy, rustdoc, release record, action)
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: task ci-lint

      - name: Smoke (examples, projections, support matrix, workspace doc-tests)
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: task ci-smoke

      # Nextest runs no doc-tests, so the feature-off doc-tests run here, once.
      - name: Feature-off doc-tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: task test-feature-off-doc

      - name: xtask
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: task test-xtask

      - name: Fuzz replay
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: task fuzz-check

  build-tests:
    name: Build workspace test archive
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # The shards run what this job compiles, and the tests that spawn `cargo` bake this
          # toolchain's path in, so every test job installs the same one.
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown

      - name: Install go-task
        env:
          TASK_VERSION: "3.52.0"
          TASK_SHA256: 02c679ffae53dca791804847d78b31731615894e292948397c971c87ac9e95bd
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/task.tar.gz" \
            "https://github.com/go-task/task/releases/download/v$TASK_VERSION/task_linux_amd64.tar.gz"
          echo "$TASK_SHA256  $RUNNER_TEMP/task.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/task-bin"
          tar -xzf "$RUNNER_TEMP/task.tar.gz" -C "$RUNNER_TEMP/task-bin" task
          echo "$RUNNER_TEMP/task-bin" >> "$GITHUB_PATH"

      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-nextest@0.9.143

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: test-workspace
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch' || github.event_name == 'pull_request' }}

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache \
            /usr/local/.ghcup /usr/lib/jvm /usr/share/swift /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/julia* /opt/microsoft /opt/google /opt/az
          df -h /

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Compile the workspace test archive
        run: task test-archive-workspace

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-archive-workspace
          path: target/nextest-archives
          if-no-files-found: error
          # The archives are zstd already; the shards of this run are their only reader.
          compression-level: 0
          retention-days: 1

  build-feature-off:
    name: Build feature-off test archive
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # A pull request from an ordinary head and a merge-group run archive the number-semantics
      # cases only (`FEATURE_OFF_NUMBER_SEMANTICS` in the Taskfile). A pull request from a
      # `queue/` head of this repository (a fork can name a branch anything), a `main` push, the
      # nightly run and a call from `release.yml` (`checkout-ref`, whatever branch a backfill was
      # dispatched from) archive all of them: the release tag reuses the queue head's run in place
      # of its own gate.
      FEATURE_OFF: ${{ inputs.checkout-ref == '' && (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && !(startsWith(github.head_ref, 'queue/') && github.event.pull_request.head.repo.full_name == github.repository))) && 'number-semantics' || 'full' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown

      - name: Install go-task
        env:
          TASK_VERSION: "3.52.0"
          TASK_SHA256: 02c679ffae53dca791804847d78b31731615894e292948397c971c87ac9e95bd
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/task.tar.gz" \
            "https://github.com/go-task/task/releases/download/v$TASK_VERSION/task_linux_amd64.tar.gz"
          echo "$TASK_SHA256  $RUNNER_TEMP/task.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/task-bin"
          tar -xzf "$RUNNER_TEMP/task.tar.gz" -C "$RUNNER_TEMP/task-bin" task
          echo "$RUNNER_TEMP/task-bin" >> "$GITHUB_PATH"

      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-nextest@0.9.143

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: test-feature-off
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch' || github.event_name == 'pull_request' }}

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Compile the feature-off test archive
        run: task test-archive-feature-off

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-archive-feature-off
          path: target/nextest-archives
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  test:
    name: Test ${{ matrix.shard }}
    needs: [build-tests, build-feature-off]
    runs-on: ubuntu-latest
    timeout-minutes: 225
    strategy:
      # Every shard reports, so one red run names every failing test rather than the first shard's.
      fail-fast: false
      matrix:
        shard: ["1/20", "2/20", "3/20", "4/20", "5/20", "6/20", "7/20", "8/20", "9/20", "10/20", "11/20", "12/20", "13/20", "14/20", "15/20", "16/20", "17/20", "18/20", "19/20", "20/20"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch the annotated release record
        run: git fetch --tags --force --prune origin

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache \
            /usr/local/.ghcup /usr/lib/jvm /usr/share/swift /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/julia* /opt/microsoft /opt/google /opt/az
          df -h /

      # The shards compile no test binary, but their tests do build: generated projects through
      # `cargo`, fixtures through `rustc`, the WASM realization and the TypeScript and Go runtimes.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.1
          components: clippy
          targets: wasm32-unknown-unknown

      # The Go the generated-module cases build with. The generated modules intentionally have no
      # go.sum, so setup-go's automatic cache would only warn.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.25.10"
          cache: false

      - name: Install go-task
        env:
          TASK_VERSION: "3.52.0"
          TASK_SHA256: 02c679ffae53dca791804847d78b31731615894e292948397c971c87ac9e95bd
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/task.tar.gz" \
            "https://github.com/go-task/task/releases/download/v$TASK_VERSION/task_linux_amd64.tar.gz"
          echo "$TASK_SHA256  $RUNNER_TEMP/task.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/task-bin"
          tar -xzf "$RUNNER_TEMP/task.tar.gz" -C "$RUNNER_TEMP/task-bin" task
          echo "$RUNNER_TEMP/task-bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          # The emitted conformance runtime is TypeScript, and its cases run under Node's own
          # test runner. Without a Node here the whole case skips — and it says so in the log
          # rather than failing, so a gate that never compiled a line of it still reports green.
          node-version: "22"

      - name: Install the TypeScript toolchain the conformance cases need
        run: |
          # Every case in `crates/verify/ess-conformance/tests/typescript_runtime.rs` is gated on
          # a tool being present: `tsc` compiles the sources, `prettier` checks their formatting,
          # and `@types/node` is what makes the typecheck a typecheck rather than `--noCheck`.
          # Versions are the ones the sources were measured green against, not floating ranges;
          # a prettier major decides formatting and a TypeScript major decides what typechecks.
          npm install --global typescript@6.0.3 prettier@3.8.1 esbuild@0.28.2
          # Outside the checkout on purpose: a `node_modules` inside it is a tree the gate did
          # not start with. The test resolves this path first, ahead of either in-tree location.
          npm install --prefix "$RUNNER_TEMP/ess-types" @types/node@26.3.0
          echo "ESS_TYPES_NODE=$RUNNER_TEMP/ess-types/node_modules" >> "$GITHUB_ENV"

      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-nextest@0.9.143

      # The registry only: `target/` is the extracted archive, never a cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: test-run
          cache-targets: "false"
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch' || github.event_name == 'pull_request' }}

      # The generated-project cases run `cargo … --offline`, so the registry is filled first.
      - name: Fetch locked dependencies
        run: cargo fetch --locked

      # Each archive is several GiB, and artifact throughput varies by an order of magnitude: on
      # 2026-10-14 (release run 38588707717, main run 38599096240) downloads outlasted two
      # 12-minute attempts on 13 and 5 of 20 shards whose tests then passed. So each archive gets
      # three 30-minute attempts, each run only when every earlier one failed. The first two may
      # fail; the last may not, so a shard that never got its archive fails rather than skipping.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        id: archives
        timeout-minutes: 30
        continue-on-error: true
        with:
          name: nextest-archive-workspace
          path: target/nextest-archives

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        id: archives-retry
        if: ${{ !cancelled() && steps.archives.outcome != 'success' }}
        timeout-minutes: 30
        continue-on-error: true
        with:
          name: nextest-archive-workspace
          path: target/nextest-archives

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        id: archives-retry-2
        if: ${{ !cancelled() && steps.archives.outcome != 'success' && steps.archives-retry.outcome != 'success' }}
        timeout-minutes: 30
        with:
          name: nextest-archive-workspace
          path: target/nextest-archives

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        id: feature-off-archive
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        continue-on-error: true
        with:
          name: nextest-archive-feature-off
          path: target/nextest-archives

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        id: feature-off-archive-retry
        if: ${{ !cancelled() && steps.feature-off-archive.outcome != 'success' }}
        timeout-minutes: 30
        continue-on-error: true
        with:
          name: nextest-archive-feature-off
          path: target/nextest-archives

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        id: feature-off-archive-retry-2
        if: ${{ !cancelled() && steps.feature-off-archive.outcome != 'success' && steps.feature-off-archive-retry.outcome != 'success' }}
        timeout-minutes: 30
        with:
          name: nextest-archive-feature-off
          path: target/nextest-archives

      - name: Workspace tests ${{ matrix.shard }}
        if: ${{ !cancelled() && (steps.archives.outcome == 'success' || steps.archives-retry.outcome == 'success' || steps.archives-retry-2.outcome == 'success') }}
        env:
          ESS_TUTORIAL_NETWORK: "1"
        run: task test-shard SHARD=${{ matrix.shard }}

      # The feature-off archive carries every binary its tests run, so the extracted workspace
      # binaries go too: on 2026-10-23, 16 of 20 shards ran out of disk with both extracted.
      - name: Drop the workspace archive
        if: ${{ !cancelled() }}
        run: |
          rm -f target/nextest-archives/workspace.tar.zst
          rm -rf target/tmp target/debug
          df -h /

      - name: Feature-off tests ${{ matrix.shard }}
        if: ${{ !cancelled() && (steps.feature-off-archive.outcome == 'success' || steps.feature-off-archive-retry.outcome == 'success' || steps.feature-off-archive-retry-2.outcome == 'success') }}
        run: task test-feature-off SHARD=${{ matrix.shard }}

  transport-network:
    name: Transport validator and JetStream execution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ESS_ASYNCAPI_CLI: ${{ github.workspace }}/../ess-asyncapi/node_modules/.bin/asyncapi
      ESS_TEST_NATS_IMAGE: nats@sha256:eda962d67930eda338222072d9a9f3818855d922ad224c399b0b01d251e9b91b
      ESS_TRANSPORT_PREFETCH_DEPS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.25.10"
          cache: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Install the pinned official AsyncAPI validator
        run: npm install --prefix "$GITHUB_WORKSPACE/../ess-asyncapi" --ignore-scripts --no-audit --no-fund --save-exact @asyncapi/cli@4.1.1

      - name: Fetch locked workspace dependencies
        run: cargo fetch --locked

      - name: Pull the pinned JetStream server
        run: docker pull "$ESS_TEST_NATS_IMAGE"

      - name: Validate parameterized AsyncAPI with the official tool
        run: cargo test --offline --locked -p ess-gen --test asyncapi_transport the_official_asyncapi_cli_accepts_the_parameterized_document -- --ignored --exact --nocapture

      - name: Execute generated Rust and Go publishers against JetStream
        run: cargo test --offline --locked -p ess-publisher --test generated both_generated_adapters_publish_parameterized_batches_to_actual_nats -- --ignored --exact --nocapture

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The workflow links the Linux host with lld, which gcc finds only through newer toolchains;
    # this job links with the system linker, so the declared toolchain is the only variable.
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}

      # The toolchain is the `rust-version` the workspace declares, read here rather than written a
      # second time, so moving the declaration moves this check. A two-part version names its `.0`
      # release, the oldest compiler the declaration admits.
      - name: Read the declared rust-version
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\([0-9.]*\)"$/\1/p' Cargo.toml)
          if [ -z "$version" ] || [ "$(printf '%s\n' "$version" | wc -l)" -ne 1 ]; then
            echo "::error::Cargo.toml does not declare exactly one workspace rust-version: '$version'" >&2
            exit 1
          fi
          case "$version" in
            *.*.*) ;;
            *) version="$version.0" ;;
          esac
          echo "toolchain=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.msrv.outputs.toolchain }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch' || github.event_name == 'pull_request' }}

      # Every target, tests included: a test only a newer compiler accepts fails here as well.
      - name: Check the workspace on the declared rust-version
        run: cargo +${{ steps.msrv.outputs.toolchain }} check --workspace --all-targets --locked

  gate:
    name: Gate
    needs: [checks, build-tests, build-feature-off, test, transport-network, msrv]
    # A skipped required check reads as passing, so this runs whatever the jobs did and fails
    # unless every one of them succeeded.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to have passed
        env:
          CHECKS: ${{ needs.checks.result }}
          BUILD_TESTS: ${{ needs.build-tests.result }}
          BUILD_FEATURE_OFF: ${{ needs.build-feature-off.result }}
          TEST: ${{ needs.test.result }}
          TRANSPORT_NETWORK: ${{ needs.transport-network.result }}
          MSRV: ${{ needs.msrv.result }}
        run: |
          status=0
          for job in "checks=$CHECKS" "build-tests=$BUILD_TESTS" "build-feature-off=$BUILD_FEATURE_OFF" "test=$TEST" "transport-network=$TRANSPORT_NETWORK" "msrv=$MSRV"; do
            echo "$job"
            if [ "${job#*=}" != "success" ]; then
              echo "::error::the ${job%%=*} job finished with '${job#*=}', not 'success'" >&2
              status=1
            fi
          done
          exit "$status"

  output-ownership-macos:
    name: Output ownership (${{ matrix.runner }})
    # A pull request, a `main` push, the nightly run and a release tag's own gate run the protocol
    # on both shipped macOS architectures; the ruleset requires both witnesses, and a release that
    # reuses a commit's checks (`release.yml`'s `prior-gate` step) requires them green there too.
    # Only a release backfill (`workflow_dispatch`) skips it: it can ask this reusable workflow to
    # gate an older source commit that predates this test target, and that commit's own Taskfile
    # and native packaging remain authoritative.
    if: ${{ inputs.checkout-ref == '' || github.event_name != 'workflow_dispatch' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Match both native architectures already shipped by the release workflow.
        runner: [macos-15-intel, macos-15]
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # The ownership target guards complete fixture/child lifetimes itself, including when
      # harness workers overlap. Dedicated cases still exercise intentional lock contention.
      RUST_TEST_THREADS: "2"
    steps:
      - name: Prepare native scratch
        run: |
          mkdir -p "$RUNNER_TEMP/ess-ownership"
          echo "TMPDIR=$RUNNER_TEMP/ess-ownership" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch' || github.event_name == 'pull_request' }}

      - name: Fetch locked dependencies
        id: ownership_dependencies
        run: cargo fetch --locked

      - name: Exercise native ownership and interrupted recovery
        if: ${{ !cancelled() && steps.ownership_dependencies.outcome == 'success' }}
        run: cargo test --offline --locked -p ess-cli --test output_ownership -- --nocapture

      - name: Exercise native ownership caller and alias regressions
        if: ${{ !cancelled() && steps.ownership_dependencies.outcome == 'success' }}
        run: cargo test --offline --locked --no-fail-fast -p ess-cli --test output_ownership_adversary --test output_ownership_correction -- --nocapture

      - name: Exercise native repository sync isolation
        if: ${{ !cancelled() && steps.ownership_dependencies.outcome == 'success' }}
        run: cargo test --offline --locked -p ess-xtask --bin ess-xtask tests::sync_
