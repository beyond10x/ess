# CI provisions the environment and delegates verification to the repository's one gate.
# The Taskfile remains the one gate; CI only provisions Rust and the pinned task runner.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      checkout-ref:
        description: Exact tag or commit to gate when called by the release workflow.
        required: false
        type: string
        default: ""

concurrency:
  group: ci-${{ inputs.checkout-ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A manual release backfill calls this workflow from `main` but must gate the tagged
          # source, not the branch that happens to contain the backfill-capable workflow.
          ref: ${{ inputs.checkout-ref || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch the annotated release record
        run: git fetch --tags --force --prune origin

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # go-task 3.52.0 declares this exact minimum. GOTOOLCHAIN is deliberately local below,
          # so the setup version and the pinned task runner must move together.
          go-version: "1.25.10"
          # The generated modules intentionally have no go.sum. setup-go's automatic cache looks
          # for one at the repository root and warns on every release run; Rust's cache below is
          # the cache this mixed-language gate actually relies on.
          cache: false

      - name: Install go-task
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.52.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Run the repository gate
        run: task check
