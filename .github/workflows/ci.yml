# CI provisions repository checks except consumer coverage, plus native macOS ownership witnesses.
# The Taskfile remains the complete gate; macOS exercises the platform-specific protocol.
#
# `task check` runs here as parallel lanes, one Taskfile task each, and the `Gate` job carries
# their joint result under the required check's name. `crates/edge/ess-xtask/tests/ci_lanes.rs`
# fails when a step of `task check` is in no lane.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      checkout-ref:
        description: Exact tag or commit to gate when called by the release workflow.
        required: false
        type: string
        default: ""

concurrency:
  group: ci-${{ inputs.checkout-ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lane:
    name: Lane (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every lane reports, so one red run names every failing lane rather than the first.
      fail-fast: false
      matrix:
        include:
          - lane: lint
            task: ci-lint
            cache: lint
          - lane: smoke
            task: ci-smoke
            cache: smoke
          # The three shards build the same test binaries, so they share one cache.
          - lane: test 1/3
            task: test-shard SHARD=1/3
            cache: test-workspace
          - lane: test 2/3
            task: test-shard SHARD=2/3
            cache: test-workspace
          - lane: test 3/3
            task: test-shard SHARD=3/3
            cache: test-workspace
          - lane: feature-off
            task: test-feature-off
            cache: feature-off
          - lane: xtask
            task: test-xtask
            cache: xtask
          - lane: fuzz
            task: fuzz-check
            cache: fuzz
            cache-workspaces: fuzz -> target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A manual release backfill calls this workflow from `main` but must gate the tagged
          # source, not the branch that happens to contain the backfill-capable workflow.
          ref: ${{ inputs.checkout-ref || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch the annotated release record
        run: git fetch --tags --force --prune origin

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # Consumer coverage binds its initial eligibility to this reviewed compiler profile.
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # go-task 3.52.0 declares this exact minimum. GOTOOLCHAIN is deliberately local below,
          # so the setup version and the pinned task runner must move together.
          go-version: "1.25.10"
          # The generated modules intentionally have no go.sum. setup-go's automatic cache looks
          # for one at the repository root and warns on every release run; Rust's cache below is
          # the cache this mixed-language gate actually relies on.
          cache: false

      - name: Install go-task
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.52.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          # The emitted conformance runtime is TypeScript, and its cases run under Node's own
          # test runner. Without a Node here the whole lane skips — and it says so in the log
          # rather than failing, so a gate that never compiled a line of it still reports green.
          node-version: "22"

      - name: Install the TypeScript toolchain the conformance lane needs
        run: |
          # Every case in `crates/verify/ess-conformance/tests/typescript_runtime.rs` is gated on
          # a tool being present: `tsc` compiles the sources, `prettier` checks their formatting,
          # and `@types/node` is what makes the typecheck a typecheck rather than `--noCheck`.
          # Versions are the ones the sources were measured green against, not floating ranges;
          # a prettier major decides formatting and a TypeScript major decides what typechecks.
          npm install --global typescript@6.0.3 prettier@3.8.1
          # Outside the checkout on purpose: a `node_modules` inside it is a tree the gate did
          # not start with. The test resolves this path first, ahead of either in-tree location.
          npm install --prefix "$RUNNER_TEMP/ess-types" @types/node@26.3.0
          echo "ESS_TYPES_NODE=$RUNNER_TEMP/ess-types/node_modules" >> "$GITHUB_ENV"

      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-nextest@0.9.143

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.cache }}
          workspaces: ${{ matrix.cache-workspaces || '. -> target' }}

      # Consumer coverage is not a lane: it stays disabled in CI by explicit operator request, and
      # local `task check` still runs it.
      - name: Run the ${{ matrix.lane }} lane
        run: task ${{ matrix.task }}

  gate:
    name: Gate
    needs: [lane]
    # A skipped required check reads as passing, so this runs whatever the lanes did and fails
    # unless every one of them succeeded.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every lane to have passed
        env:
          LANES: ${{ needs.lane.result }}
        run: |
          echo "lanes: $LANES"
          if [ "$LANES" != "success" ]; then
            echo "::error::the gate lanes finished with '$LANES', not 'success'" >&2
            exit 1
          fi

  output-ownership-macos:
    name: Output ownership (${{ matrix.runner }})
    # Branch/PR validation qualifies the new protocol on both shipped macOS architectures.
    # A release backfill can ask this reusable workflow to gate an older source commit that
    # predates this test target; its own Taskfile and native packaging remain authoritative.
    if: ${{ inputs.checkout-ref == '' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Match both native architectures already shipped by the release workflow.
        runner: [macos-15-intel, macos-15]
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # The ownership target guards complete fixture/child lifetimes itself, including when
      # harness workers overlap. Dedicated cases still exercise intentional lock contention.
      RUST_TEST_THREADS: "2"
    steps:
      - name: Prepare native scratch
        run: |
          mkdir -p "$RUNNER_TEMP/ess-ownership"
          echo "TMPDIR=$RUNNER_TEMP/ess-ownership" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Fetch locked dependencies
        id: ownership_dependencies
        run: cargo fetch --locked

      - name: Exercise native ownership and interrupted recovery
        if: ${{ !cancelled() && steps.ownership_dependencies.outcome == 'success' }}
        run: cargo test --offline --locked -p ess-cli --test output_ownership -- --nocapture

      - name: Exercise native ownership caller and alias regressions
        if: ${{ !cancelled() && steps.ownership_dependencies.outcome == 'success' }}
        run: cargo test --offline --locked --no-fail-fast -p ess-cli --test output_ownership_adversary --test output_ownership_correction -- --nocapture

      - name: Exercise native repository sync isolation
        if: ${{ !cancelled() && steps.ownership_dependencies.outcome == 'success' }}
        run: cargo test --offline --locked -p ess-xtask --bin ess-xtask tests::sync_
