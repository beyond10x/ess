name: Release ESS component
description: Build or adopt an image, attest it, and publish the exact ESS chart and component bundle.

inputs:
  service:
    description: Stable ESS system identifier.
    required: true
  version:
    description: Exact release version and Git tag.
    required: true
  ess-revision:
    description: Exact released ESS Git commit to install.
    required: true
  check-command:
    description: Repository-owned verification command run before publication.
    required: false
    default: task check
  component-path:
    description: Repository-relative ess-component/1 path.
    required: false
    default: ess/component.yaml
  build-path:
    description: Repository-relative ess-build/1 path.
    required: false
    default: ess/build.yaml
  build-ir:
    description: Repository-relative canonical ess-build-ir/1 path.
    required: false
    default: ess/compiled/build.ir.json
  runtime-ir:
    description: Repository-relative canonical ess-runtime-ir/1 path.
    required: false
    default: ess/compiled/runtime.ir.json
  image-repository:
    description: OCI repository receiving or already containing the runtime image.
    required: true
  build-image:
    description: Build and push the image through ESS; false adopts the existing version tag.
    required: false
    default: "true"
  chart-namespace:
    description: OCI namespace receiving the Helm chart.
    required: true
  evidence-repository:
    description: OCI repository receiving release evidence.
    required: true
  bundle-repository:
    description: OCI repository receiving the canonical component bundle.
    required: true
  registry:
    description: OCI registry hostname.
    required: true
  registry-username:
    description: OCI registry login.
    required: true
  registry-token:
    description: OCI registry token.
    required: true

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      with:
        toolchain: "1.85.0"
        components: rustfmt
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
    - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6
    - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac
    - uses: anchore/sbom-action/download-syft@f8bdd1d8ac5e901a77a92f111440fdb1b593736b
    - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52
    - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-token }}
    - name: Install exact ESS release
      shell: bash
      env:
        ESS_REVISION: ${{ inputs.ess-revision }}
      run: >-
        cargo install --locked --git https://github.com/beyond10x/ess.git
        --rev "$ESS_REVISION" --root "$PWD/target/ess/$ESS_REVISION"
        --bin ess ess-cli
    - name: Publish exact ESS release
      shell: bash
      env:
        COMPONENT_SERVICE: ${{ inputs.service }}
        COMPONENT_VERSION: ${{ inputs.version }}
        ESS_REVISION: ${{ inputs.ess-revision }}
        CHECK_COMMAND: ${{ inputs.check-command }}
        COMPONENT_PATH: ${{ inputs.component-path }}
        BUILD_PATH: ${{ inputs.build-path }}
        BUILD_IR: ${{ inputs.build-ir }}
        RUNTIME_IR: ${{ inputs.runtime-ir }}
        IMAGE_REPOSITORY: ${{ inputs.image-repository }}
        BUILD_IMAGE: ${{ inputs.build-image }}
        CHART_NAMESPACE: ${{ inputs.chart-namespace }}
        EVIDENCE_REPOSITORY: ${{ inputs.evidence-repository }}
        BUNDLE_REPOSITORY: ${{ inputs.bundle-repository }}
      run: bash "$GITHUB_ACTION_PATH/release.sh"
