domain: discovery.inputs

types:
  - name: discovery.inputs.ManifestFormat
    kind: enum
    variants: ["ess-inputs/1", "ess-inputs/2"]

  - name: discovery.inputs.RelativeInputPath
    kind: newtype
    of: String
    invariants:
      - 'value != ""'

  - name: discovery.inputs.InputManifest
    kind: struct
    fields:
      - name: format
        type: discovery.inputs.ManifestFormat
      - name: specification
        type: List<discovery.inputs.RelativeInputPath>
      - name: scenarios
        type: List<discovery.inputs.RelativeInputPath>
      - name: requires
        type: Optional<String>
