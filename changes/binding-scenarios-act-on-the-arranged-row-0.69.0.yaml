publishedAt: 2026-10-24T00:00:00Z
title: Lists can be filled or appended to, absent members sent as null, and ess generate types writes body types
summary: >-
  Format `ess/31` lets a `sets:` entry store `[]` or append an input element to a stored list, a
  `List` input carry an `example:`, and a field's `presence:` be `omitted_or_null`. `ess generate
  types` generates a command's input and response and a view's row. Binding scenarios act on the
  row their setup arranged, or are refused as ESS-SYNTH-010.
kind: capability
impact: notable
