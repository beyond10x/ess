id: ess/binding-scenarios-act-on-the-arranged-row-0.69.0
repository: ess
publishedAt: 2026-10-22T00:00:00Z
title: A binding scenario acts on the row its setup arranged, and one it cannot set up is refused by name
summary: >-
  Binding scenarios that failed against a correct implementation now pass: the trigger acts on the
  row the setup arranged, a refusal-policy scenario is set up through a publisher that does not
  refuse the missing row, and an unbounded `retry` binding is no longer unsupported. Where no such
  setup exists, the scenario is refused as ESS-SYNTH-010.
kind: capability
impact: notable
