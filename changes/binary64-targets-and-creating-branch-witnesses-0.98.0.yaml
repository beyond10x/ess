title: The Rust, Go and web targets carry a finite Binary64, and synthesis witnesses more creating branches
summary: >-
  `ess generate synthesize --target rust`, `--target go` and `--target web` carry a finite
  `Binary64`. Synthesis writes more scenarios for creating branches and row-set refusals.
  Validation refuses an `exists: false` branch declared below a refusal it answers first, and an
  ordering comparison over an enum.
