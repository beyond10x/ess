title: Nullable Binary64 fields in generated types, name aliases in the schema, and synthesis that follows bindings
summary: >-
  ess generate types realizes an optional, nullable Binary64 field and refuses a responseless
  command's response root by name. The schema admits the id: and component: name aliases.
  Synthesis follows bindings that rewrite a related row, sends refusals beside external branches to
  a present related row, and picks wrong-state rows with known stored guards.
kind: capability
