title: A suite holds a command at a fixed now, so a guard on a time boundary is tested exactly there
summary: >-
  A conformance suite can hold the instant a target reads as `now` for one command, and synthesis
  adds a scenario on each `now` boundary a command decides by. Format `ess/26` holds an
  external refusal beside an existing row to leave it unchanged. Generated Rust decoders
  enforce a newtype's alphabet and length; the Go and TypeScript explorers draw timestamps.
