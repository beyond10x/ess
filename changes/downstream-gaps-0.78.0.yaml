title: Structured input examples, rows a deployment provides, and lifecycle summaries
summary: >-
  From ess/33 a struct, map or Json input may carry an example that synthesis sends as written. An
  entity may declare that the deployment provides its rows; suites resolve such a row as an entity
  fixture and the interpreted target creates it. Transitions and states may carry a summary.
