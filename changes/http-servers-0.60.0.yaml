publishedAt: 2026-10-14T00:00:00Z
title: HTTP bindings declare encodings, statuses, headers and redirects, and synthesis writes Rust and Go servers
summary: >-
  An `ess-http/1` route declares its request encoding, each outcome's status, body, headers and
  redirect, and the standard refusals. `--http` projects them into OpenAPI, and
  `ess generate synthesize --target rust` or `go` writes a server that serves the binding
  ([#493](https://github.com/beyond10x/ess/issues/493)).
kind: capability
impact: significant
