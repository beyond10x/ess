title: Set-effect bindings, row sets, predicate refusal policies and affects rows past predicates get their scenarios
summary: >-
  Synthesis arranges the rows a binding into a per-row set effect needs, keeps a row set
  followable until a step sets its binding off, witnesses a predicate refusal policy through an
  arranged row, and arranges an affects row past a creator's predicate guard. A caller model keeps
  its binding refusal scenarios.
