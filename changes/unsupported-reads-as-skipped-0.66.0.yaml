title: A generated Go or TypeScript runner shows an unsupported scenario as skipped, and the run still fails
summary: >-
  Under report format 2 the generated Go and TypeScript runners end an unsupported required scenario
  as a skipped subtest or case carrying the target's reason, not a failed assertion. The run still
  fails once, with one message naming how many required scenarios were unsupported; the report is
  unchanged.
