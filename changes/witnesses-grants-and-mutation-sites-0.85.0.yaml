title: Every witness reads back its effect, and the mutation audit covers grants and lists its gaps
summary: >-
  From format ess/34 a compensating refusal may delete its row, and a named refusal requires the
  row it addressed unchanged. The mutation audit gains grant-drop and grant-add, lists the sites it
  could not mutate, mutates refusals that carry a payload and runs on the scenario clock. Go
  synthesis, the clap target and the generated explorers fix six defects.
