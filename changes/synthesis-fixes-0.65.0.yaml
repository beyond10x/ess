title: Synthesis arranges the rows binding, row-set and one-time disclosure scenarios read
summary: >-
  Binding scenarios arrange the rows a per-row event, a refusal policy or a stored target names;
  row-set guards are witnessed beside bindings; `affects:` rows are arranged behind a missing-row
  guard; and one-time disclosure cells reach caller, unknown-instance and wrong-state branches the
  way the ordinary suite does.
