title: Journeys reach every control a page declares, and a collection draws the controls it declares
summary: >-
  `ess ui test` gains a step for every control a page declares, and the terminal and the React app
  send the same reorder and toggle payloads. The React collection sorts numbers by value and draws
  its sort, expand, reorder, selection and column controls. Synthesis uses the input examples for a
  further instance.
