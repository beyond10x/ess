title: Commands and views bind to HTTP routes, and mutation testing covers more of a model
summary: >-
  `ess-http/1` binds commands and views to HTTP routes, projected into OpenAPI by
  `--http` ([#493](https://github.com/beyond10x/ess/issues/493)). `mutate` covers
  `when_subject:`/`when_related:` guards and authored scenarios
  ([#515](https://github.com/beyond10x/ess/issues/515)). Go synthesis builds when bounded contexts
  reference each other in a loop.
