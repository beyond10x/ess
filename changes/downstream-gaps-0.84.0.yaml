title: Generated servers refuse what their OpenAPI refuses, and generated UIs call their binding's routes
summary: >-
  Generated Rust servers refuse a malformed Timestamp and an undeclared JSON member at decode, and
  the Go server an undeclared top-level member. Authored success acts assert no error. Denied-grant
  scenarios reach ranked views and every ungranted actor. Generated UIs call their binding's routes.
