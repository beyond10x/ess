title: Fixture mode applies a command's effect, and generated decoders check struct invariants
summary: >-
  In fixture mode a confirmed command now changes the fixture rows as the model says, in the
  generated React project and in `ess ui test --model`. Generated Go and Rust decoders answer 400
  for a struct that breaks a declared invariant. Synthesis witnesses a held-state guard without a
  view publishing `state`.
