title: Optional list appends, binding refusals that check event identities, and refusals that tell states apart
summary: >-
  The interpreted target appends null for an absent optional list element. Binding refusal
  scenarios compare trigger event identities. A row-set guard beside named rows is witnessed on
  every refusal order. No-view input refusals read the record back through sends that tell its
  state apart.
