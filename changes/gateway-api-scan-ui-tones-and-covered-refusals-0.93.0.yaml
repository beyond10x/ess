title: Kubernetes scans read the Gateway API, UI values take tones, and an authored scenario retires a refusal
summary: >-
  A full Kubernetes scan reads Gateway API gateways and routes into `infra-ir/4`. UI columns and
  fields take a tone, React draws the declared tokens, and a UI test declares how each read and
  command is answered. An authored `ess-scenario/7` scenario can retire the refusal it covers.
  Format `ess/37` opens.
