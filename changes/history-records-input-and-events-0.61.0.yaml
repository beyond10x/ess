title: Concurrent histories record each call's input and events, and check-history holds them
summary: >-
  `ess-history/3` records each operation's input and published events, and `check-history` holds a
  target to both. Concurrent exploration arranges `external:` causes and replays a failing seed
  alone. Synthesis arranges period-bounded views, Rust types take raw JSON values, and the
  one-time response guide counts disclosure cells.
