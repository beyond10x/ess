schema: b10x-change/v1
id: ess/actor-grants-enforced-0.49.0
repository: ess
publishedAt: 2026-10-01T18:00:00Z
title: Generated servers enforce actor grants
summary: >-
  In a specification that declares actors, generated Rust and Go servers take the authenticated caller and answer `403 not granted` before a command runs for a caller the specification does not grant it; served suites witness the refusal. Existing callers of `dispatch`, `handle` and `serve` must pass the caller.
kind: breaking
impact: significant
source:
  url: https://github.com/beyond10x/ess/releases/tag/0.49.0
  version: 0.49.0
journeys: [specify, operate-services]
affectedSurfaces: [ess/docs]
