title: A value can be computed by a typed expression, and every guard answers in one precedence order
summary: >-
  Format `ess/27` computes a value from an expression in `sets:`, payloads and view fields, reads
  digest functions in guards, and answers a command's guards in one precedence order, admitting
  the guard pairs that order settles. `ess verify conform diff` compares two suites, and a suite
  states the event catalog once.
kind: capability
