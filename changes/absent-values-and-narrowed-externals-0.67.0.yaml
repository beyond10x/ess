title: A guard says what an absent value compares as, and an external branch can be narrowed to some rows
summary: >-
  Format `ess/29` lets a guard write `coalesce(x, d)` on the left of a comparison, so a guard over an
  `Optional` decides every record, and lets `external:` carry `when_subject:`. A one-time read cell
  names its reader (suite `ess-conformance/56`). Synthesis witnesses more ranked heads and connective
  children, and many row-set selectors take seconds.
kind: capability
