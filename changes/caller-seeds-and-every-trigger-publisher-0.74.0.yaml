title: Synthesis seeds work on caller models, and a binding tries every publisher of its trigger
summary: >-
  A synthesis seed is admitted for a model whose actors declare caller attributes, and the seed
  row gives the seeded run its caller. A binding is witnessed through any branch that publishes
  its trigger, including one that publishes per changed row. A refusal names a state that only a
  set move reaches.
