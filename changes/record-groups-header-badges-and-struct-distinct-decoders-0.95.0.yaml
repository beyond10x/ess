title: Records group their fields, a page header takes a badge, and generated decoders check a struct's distinct keys
summary: >-
  In `ess-ui/1` a record groups its fields under headings and a page header takes a badge.
  Generated Rust and Go build again for a struct that declares `distinct:` and answer 400 for a
  list with duplicate keys. `ess specify validate` refuses a `Decimal` literal that binary64
  cannot hold exactly.
