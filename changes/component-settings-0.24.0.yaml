id: ess/component-settings-0.24.0
repository: ess
publishedAt: 2026-09-12T00:00:00Z
title: A component declares its settings, and the runtime slots are derived from them
summary: >-
  `settings:` states each of a component's configuration inputs once, typed from the
  specification's own `types:`. `ess specify runtime compile` derives the `ess-runtime/1` config
  and secret slots from it, and refuses a hand-authored slot or two settings binding one
  environment variable twice. Absence is stated with `Optional<...>` and nothing else.
kind: capability
impact: significant
source:
