title: A conformance suite records what it covers, and what it left out
summary: >-
  Opt-in `ess-conformance/5` records selected generated and authored coverage, omitted scenarios,
  source identities and every refusal occurrence. Report 2 then distinguishes complete passing
  conformance from empty, unknown or incomplete coverage — a pass over nothing and a pass over
  everything stop reading the same.
