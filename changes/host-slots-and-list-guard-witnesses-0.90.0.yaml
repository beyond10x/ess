title: UI documents declare host slots, and synthesis witnesses guards over lists of identities
summary: >-
  An ess-ui/1 document may declare host slots, places the host application draws itself; ess ui
  check holds them to their rules and lists the generator's backlog. Conformance synthesis
  witnesses a guard over a list of identities beside an updates subject, in a creating command and
  over several literals, and a null tag draws no chip.
