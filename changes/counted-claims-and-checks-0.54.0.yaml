title: Counted event claims, generate --check and validation completeness
summary: >-
  Suites `ess-conformance/44` and `/45` match repeated event claims as a set in the Rust, Go and
  TypeScript runners. `ess generate --check` reports drift without writing, `ess specify
  validate` reports completeness, `ess specify formats` lists every format, and a CLI binding
  takes a trailing argument list. A membership operand naming a parameter is refused.
kind: capability
impact: notable
