id: ess/command-line-surface-0.14.0
repository: ess
publishedAt: 2026-09-04T10:01:53Z
title: A component can declare a command-line surface, and ESS synthesizes its parser
summary: >-
  `reached_by: command_line` and a `cli:` block state that a component's callers are people at a
  terminal and where each command sits in the tree. `ess generate synthesize --target clap` emits
  the parser, the handler obligations and the completion scripts from that declaration.
kind: capability
impact: significant
