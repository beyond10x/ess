title: A command guards named rows beside a row set, states carry wire spellings, and conformance replays no longer stop with InvalidReplay
summary: >-
  Format `ess/32` lets one command guard on rows its input names beside a row-set guard, a struct
  declare `fields: []` and a lifecycle state declare its wire spelling. A view may publish a
  `Decimal`. `ess verify conform synthesize` no longer stops with InvalidReplay at `ess/26` and later.
