title: React projects register host slots, and the terminal draws them as labelled regions
summary: >-
  A UI document holding host slots now generates for React: the project exports a registry type
  with one entry per slot, each component receiving a data adapter narrowed to the slot's declared
  reads and commands. The terminal draws each slot as a labelled placeholder, and a UI test step
  that acts inside a slot is refused by one rule in both renderers.
kind: capability
