title: A route takes a bare body, a literal segment wins, and an each write takes repeated identities
summary: >-
  A command route may take one input field as its bare request body, and a literal path segment
  wins over a variable one. From ess/35 an each write may name one row more than once, in list
  order. A generated file carries only its own slice digest; the model digest moves to
  ess-output-state/4, which older releases refuse.
kind: capability
impact: significant
