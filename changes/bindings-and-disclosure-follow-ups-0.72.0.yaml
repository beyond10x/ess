title: Bindings past related and set guards, and fresh-input disclosure follow-ups, get their scenarios
summary: >-
  Synthesis now arranges the related row or the selected rows a binding's invoked command reads
  through a `when_related:` guard, where the command updates the trigger's row, chooses its branch
  by a set guard, or shares the trigger's guard. A one-time response's follow-up whose set effect
  is pinned to a fresh input composes after the disclosure.
