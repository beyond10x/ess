publishedAt: 2026-10-09T00:00:00Z
title: A CLI binding may omit globals, ess verify diff names changes that break callers, and runners check constrained responses
summary: >-
  `ess-cli/2` lets a CLI binding omit its config and output globals. `ess verify diff` classifies
  added and removed domains and rates changes that refuse an existing caller as breaking. Runners
  check responses of constrained `String` newtypes. Route-escaping wire names and always-true
  refusals are refused, and synthesis covers more guards.
kind: capability
impact: notable
