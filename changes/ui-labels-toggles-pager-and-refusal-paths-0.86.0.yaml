title: UI documents label their values, show a toggle's state, page by size and report a refusal where it is
summary: >-
  An ess-ui/1 field or badge shows a declared label for each value, a row toggle shows the state it
  flips, a server-paged collection gains a page-size control and a pager footer, and a refused
  document is reported at the refused node's own path. An export takes a params map and an empty
  state a title.
