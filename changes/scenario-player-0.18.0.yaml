publishedAt: 2026-09-04T14:08:16Z
title: A specification's scenarios can be played in a browser
summary: >-
  `ess verify conform web` emits a browser page that walks authored scenarios, showing actors,
  state, selected views, and declared consequences. It replays model-determined behavior without
  executing an implementation, so authors can inspect a specification before filling its obligations.
kind: capability
impact: significant
