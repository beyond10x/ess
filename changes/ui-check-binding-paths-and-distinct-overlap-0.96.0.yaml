title: ess ui check resolves every binding path, and two more refusals are told apart
summary: >-
  `ess ui check` resolves the root and the section of every binding path and reports a state,
  parameter or section that is not in scope. Two errors of one wire name bind on one status
  where a field tells their bodies apart. Synthesis sends the overlap of two refusals when one
  guard is a `distinct` predicate over a list.
kind: capability
impact: notable
