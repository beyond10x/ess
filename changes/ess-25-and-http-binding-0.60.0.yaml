title: Source format ess/25, and an HTTP binding that generates Rust and Go servers
summary: >-
  `ess/25` adds create-or-update selection by stored fields, trimmed text guards, one event per
  changed row and refusals ahead of held state. `ess-http/1` binds commands and views to HTTP;
  `ess generate` projects it to OpenAPI and emits Rust and Go servers. `ess-composition/4` adds roles.
kind: capability
impact: significant
