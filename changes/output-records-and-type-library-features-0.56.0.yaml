publishedAt: 2026-10-07T00:00:00Z
title: Committed output records carry no machine path, and generated Rust types stop forcing arbitrary precision
summary: >-
  A settled `.ess-output/state.json` no longer records the output's absolute path, device or inode,
  and regeneration refuses an edited owned file. Generated Rust types turn on arbitrary precision
  only where they hold JSON numbers. Entity Runtime lowers alphabets and text counts, and
  concurrent generation under a shared directory no longer refuses as busy.
kind: capability
