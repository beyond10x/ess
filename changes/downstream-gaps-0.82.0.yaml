title: Binding scenarios that check event identities, refusals that probe the record, and validation that names the file
summary: >-
  Synthesized binding scenarios compare the trigger event's identity fields with the instance or row
  they act on. The arranged half of a refusal without an identity view probes the record through the
  command. ess specify validate names the file a refusal was read from in a specification of several
  files.
