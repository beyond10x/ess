title: A view and a guard read the row a reference names
summary: >-
  Format `ess/28` lets a view field and a view filter read the row a reference of the source
  names, one hop, as it is when the view is read; a value read a referenced row's lifecycle state;
  a branch require several related rows at once; and a guard refuse a list of references that
  names a missing row. Suite `ess-conformance/54` witnesses each navigated view.
kind: capability
