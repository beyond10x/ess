title: Event publishers, recursive Rust contracts and consumer fixes
summary: >-
  ESS adds declared event transports and typed Rust/Go publishers with native timestamps,
  positional names and constant constructors. Optional recursive Rust types, generated Go
  behavior, typed view parameters, UI filters and integer bounds complete the update.
  Breaking interfaces are documented in the release notes.
