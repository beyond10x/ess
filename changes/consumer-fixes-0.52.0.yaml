title: Generated Go behavior, served view parameters and consumer fixes
summary: >-
  ESS generates Go command behavior and view queries, passes typed view parameters
  through Go and Rust servers, and filters UI reads in React and terminal renderers.
  Fixes cover creation identities, conformance synthesis and browser startup.
  Generated behavior and view interfaces have breaking changes documented in the release notes.
