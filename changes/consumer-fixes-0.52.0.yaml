title: Generated Go behavior, served view parameters and consumer fixes
summary: >-
  ESS generates determined Go command behavior and view queries, passes typed query
  parameters through generated Go and Rust servers, and filters UI reads consistently
  in React and terminal renderers. Consumer fixes cover creation identities,
  conformance synthesis and browser runner startup. Generated behavior and served
  view interfaces include breaking changes described in the release notes.
