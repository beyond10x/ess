title: HTTP-bound inputs and short names in generated types, and input-type rules in Entity Runtime
summary: >-
  ess generate types takes --http, so each command input is the request body its bound OpenAPI
  document publishes, and --names short combines with --all-commands and --all-views. Entity Runtime
  lowering keeps an unstored input type's invariants and prefix or refuses them by name. Synthesis
  decides an identity guard on the row it arranges.
