publishedAt: 2026-10-14T00:00:00Z
title: Source format ess/25 selects an upsert's update by the stored row and adds per-row events and default view rows
summary: >-
  `ess/25` lets a create-or-update command pick its update with `when_subject:`
  ([#530](https://github.com/beyond10x/ess/issues/530)), publish an event per changed row, answer an
  `external:` refusal before the row is read, compare `trimmed:` text, and give a view an `absent:`
  row. `ess-diff/19` classifies the view change.
kind: capability
impact: significant
