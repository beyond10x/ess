title: Set updates, affects rows and converted binding inputs get the scenarios synthesis used to refuse
summary: >-
  Synthesis now arranges the rows of a set update whose creator copies from, or refuses a missing,
  related row, and rows the update changes where both write one input. `affects:` rows are arranged
  past an emitting not-found branch, and a binding input filled across a plain newtype conversion
  arranges its related row.
