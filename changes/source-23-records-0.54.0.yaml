title: Source format ess/23, re-keyed records, bulk deletes and enum attributes
summary: >-
  `ess/23` lets an update re-key its record, a value read the state held before the outcome,
  `deletes:` remove every row a filter selects, an `affects:` entry write one record per list
  element and an enum declare typed variant attributes. Synthesis witnesses state predicates,
  struct-identity selectors and row sets beside an addressed record.
kind: capability
impact: significant
