title: UI values render in their declared form, forms show their help, and synthesis refuses a misplaced not-found once
summary: >-
  An ess-ui/1 value renders in the form its field declares, durations as h:mm:ss and byte counts
  in B to GB; choices, filter bars and forms show their placeholder, reset label and help.
  Synthesis refuses a not-found branch after a guarded move once, with its repair, and journeys
  find a row toggle in either state again.
