title: A composition states which component plays another's role, and which command implements or gates it
summary: >-
  `ess-composition/4` adds `roles:`: one imported component plays another's, and each local
  command `implements` or `gates` a contract command, checked for input drift by
  `ess specify compose` ([#525](https://github.com/beyond10x/ess/issues/525)).
