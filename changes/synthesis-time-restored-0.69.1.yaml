title: Synthesis takes the time it took in 0.68.0 again where related rows reach their state through a guarded move
summary: >-
  0.69.0 arranged the rows a creating branch leaves once per arrangement that asked, so a
  specification whose related rows reach their state through a move with a stored-field guard
  synthesized for more than 13 minutes. Those rows are now made once per synthesis, the time is back
  at 0.68.0's, and the synthesized suites keep the scenarios 0.69.0 added.
