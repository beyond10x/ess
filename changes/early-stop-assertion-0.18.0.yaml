title: An authored scenario can claim that a consumer halted an ordered scan
summary: >-
  `ess-scenario/1` gains `halts_after: <n>` — a reader of an ordered view takes `n` rows, says
  stop, and the producer stops too. It is the seventh claim key and not a seventh row shape,
  because two implementations returning the same rows differ on it and no predicate over rows can
  decide it. The target reports how many rows its ordered source produced and whether the reader's
  stop is what ended the read; a target that cannot read a view a row at a time reports
  `unsupported` rather than agreeing. `ess-conformance/4`, one new refusal, two new steps.
kind: feature
impact: significant
journeys: [specify, verify]
affectedSurfaces: [ess/docs]
