title: A specification carries the scenarios an author wrote, not only the ones it obliges
summary: >-
  `ess-scenario/1` is a document a person writes: an arrangement of modelled instances, a timeline
  of modelled commands, and expectations in the vocabulary a suite already has. It compiles into
  the same `ess-conformance/2` suite synthesis emits, under an id of its own so the two populations
  cannot be confused, and twenty-seven refusals hold every name it uses to what the model declares.
