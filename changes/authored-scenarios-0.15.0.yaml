title: A specification carries the scenarios an author wrote, not only the ones it obliges
summary: >-
  Authors can declare modelled instances, command timelines, and expectations in `ess-scenario/1`.
  These scenarios compile into `ess-conformance/2` with identities distinct from synthesized suites.
  Twenty-seven refusals check their names against the model. Included in the published 0.16.0 release.
