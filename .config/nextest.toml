# Nextest runs every test in its own process. These binaries coordinate their tests through state
# shared by one process, so they run one test at a time; `crates/edge/ess-xtask/tests/ci_lanes.rs`
# finds such binaries from their source and fails when one is missing here.

[test-groups]
# `support/browser.rs`'s `STARTUP` mutex admits one Firefox start per process; in parallel processes Firefox BiDi startup overran its 30 s deadline in CI.
firefox = { max-threads = 1 }
# `scratch()` prunes every `recovery-*` fixture not carrying its own pid, so with one process per test it deletes the fixtures of every test running beside it.
recovery-fixtures = { max-threads = 1 }

[[profile.default.overrides]]
filter = "binary_id(ess-cli::coverage_browser) | binary_id(ess-cli::coverage_writer_adversary_pass1) | binary_id(ess-cli::coverage_writer_adversary_pass2) | binary_id(ess-cli::browser_startup_slow_serve_boundary) | binary_id(ess-cli::browser_startup_refusal_boundary) | binary_id(ess-cli::replay_fidelity_browser)"
test-group = "firefox"

[[profile.default.overrides]]
filter = "binary_id(ess-cli::execution_recovery)"
test-group = "recovery-fixtures"
