# Nextest runs every test in its own process. These binaries coordinate their tests through state
# shared by one process, so they run one test at a time; `crates/edge/ess-xtask/tests/ci_lanes.rs`
# finds such binaries from their source and fails when one is missing here.

[test-groups]
firefox = { max-threads = 1 }

[[profile.default.overrides]]
filter = "binary_id(ess-cli::coverage_browser) | binary_id(ess-cli::coverage_writer_adversary_pass1) | binary_id(ess-cli::coverage_writer_adversary_pass2) | binary_id(ess-cli::browser_startup_slow_serve_boundary) | binary_id(ess-cli::browser_startup_refusal_boundary) | binary_id(ess-cli::replay_fidelity_browser) | binary_id(ess-cli::one_time_browser) | binary_id(ess-cli::browser_product_adversary) | binary_id(ess-cli::browser_response_conformance) | binary_id(ess-cli::captured_identities_browser)"
test-group = "firefox"
threads-required = "num-test-threads"

# A wall-clock ratio between two timings in one process: a neighbouring test skews one timing and
# not the other (ess#85, 2026-09-25), so it runs with the whole shard to itself.
[[profile.default.overrides]]
filter = "test(=the_cost_of_one_document_stays_within_reach_of_linear_in_the_registry)"
threads-required = "num-test-threads"

# A test over 60 s is killed and fails (the organization rule `Tests stay fast`). Each test seen
# over 60 s on CI has an override below with 1.2 times its longest time there, from 14 CI runs of
# 2026-11-26 and 2026-11-27 (13 successful, and 46063361909, red on one test killed at its
# override, whose 82 s is taken as its longest time), and so has each test whose longest time
# there was 50 to 60 s (1.2 times it, at most 72 s), because tests that close cross 60 s on some
# runs; each is a defect of story:the-test-step-meets-the-test-budget. `ci_lanes.rs` pins the list, so an override
# may only be dropped or lowered, and refuses any spelling of this file but the one used here.
[profile.ci]
slow-timeout = { period = "60s", terminate-after = 1 }
final-status-level = "slow"

[profile.ci.junit]
path = "junit.xml"

