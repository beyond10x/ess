components:
  - component: request-service
    summary: serves the request domain
    owns:
      domains:
        - desk.requests
    accepts:
      commands:
        - desk.requests.ApproveRequest
        - desk.requests.RejectRequest
    publishes:
      events:
        - desk.requests.RequestApproved
        - desk.requests.RequestRejected
    reached_by: network
