[package]
name = "ess-ui-tui"
description = "A terminal renderer for ess-ui/1 documents: any document runs as a ratatui application, answering reads from its fixtures and playing its channels' event scripts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
ess-ui = { path = "../ess-ui" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm"] }
crossterm = "=0.28.1"
unicode-width = "=0.2.0"

[dev-dependencies]
ess-ui-check = { path = "../ess-ui-check" }

[lints]
workspace = true
