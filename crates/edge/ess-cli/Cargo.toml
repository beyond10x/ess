[package]
name = "ess-cli"
description = "Command-line interface for Executable System Specifications."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "ess_cli"
path = "src/lib.rs"

[[bin]]
name = "ess"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
ess-domain.workspace = true
ess-compiler.workspace = true
ess-composition.workspace = true
ess-realization.workspace = true
ess-deployment.workspace = true
ess-conformance.workspace = true
ess-diff.workspace = true
ess-gen.workspace = true
ess-synth.workspace = true
infra-domain.workspace = true
infra-compiler.workspace = true
infra-analyze.workspace = true
infra-spec.workspace = true
infra-project.workspace = true
ess-kubernetes.workspace = true
ess-openapi.workspace = true
schema-contract.workspace = true
semver.workspace = true
fluent-uri = "0.4.1"
# The edge owns descriptor-relative output admission, locking and same-mount publication.
rustix = { version = "=1.1.4", features = ["fs", "process"] }
sha2 = "0.11"
getrandom = "0.3"
# The recovery profile admits ESS-generated charts only, so the chart payload is decoded through a
# bounded pure-Rust reader and compared member by member with `project_helm`'s five files. No C
# backend: `rust_backend` keeps the decompressor inside the Rust toolchain the MSRV pins.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }

[[bin]]
# Test-only. The offline qualification requires real, separate driver processes running the same
# production parser, admission, chart, journal and process code, and a `[[bin]]`-only crate cannot
# give a second process that code. This target is that entry point; it ships no bypass into `ess`.
name = "ess-recovery-driver"
path = "tests/support/recovery_driver.rs"

[[bin]]
# Test-only. The independently controlled synthetic target and the fault-injecting stand-in for
# the admitted Helm artifact. It outlives the first driver, which is what makes a restart case a
# restart rather than a replay.
name = "ess-recovery-fake"
path = "tests/support/fake_recovery.rs"

[dev-dependencies]
# `tests/go_conformance.rs` writes a scenario by hand, in the same types synthesis writes one in, so
# what the emitted Go runner is held to is the serialiser an adopter's suite comes out of.
ess-primitives.workspace = true

[lints]
workspace = true
