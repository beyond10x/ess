format: ess/20
system: telemetry
version: v1
domain: telemetry.data
types:
  - {name: telemetry.data.Id, kind: newtype, of: String}
  - {name: telemetry.data.Unused, kind: newtype, of: String}
  - name: telemetry.data.Details
    kind: struct
    fields:
      - {name: sequence, type: Integer}
      - {name: title, type: String}
      - {name: amount, type: Integer}
    invariants:
      - amount >= -2147483648
      - amount <= 2147483647
      - sequence >= -9223372036854775808
      - sequence <= 9223372036854775807
events:
  - name: telemetry.data.Recorded
    fields:
      - {name: id, type: telemetry.data.Id, wire: record-id}
      - {name: details, type: telemetry.data.Details}
      - {name: label, type: 'Optional<String>'}
      - {name: samples, type: 'List<Optional<Boolean>>'}
      - {name: weight, type: Binary64}
      - {name: measurements, type: 'Map<String, Optional<Binary64>>'}
  - name: telemetry.data.Ignored
    fields: [{name: ignored, type: Boolean}]
