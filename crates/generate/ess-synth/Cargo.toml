[package]
name = "ess-synth"
description = "Structural synthesis of an executable system specification: a plan with one disposition per capability, and the Rust workspace the generated half of it determines."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
ess-compiler.workspace = true
ess-domain.workspace = true
ess-primitives.workspace = true
# For `Artifact` and `Provenance`, not for its generators: the projections stay in `ess-gen` and the
# synthesis stays here (review H6), but an artifact's shape and where-it-came-from stamp are one
# convention across both crates, and a second provenance type is the drift H3 already caught once.
ess-gen.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Only `tests/declared_behaviour.rs`: the suite a specification synthesizes, run against the
# behaviours this crate generates for it.
ess-conformance.workspace = true
# Only `tests/served_publication.rs`: a served answer validated against the contract the same server
# serves. Same version and spelling as `ess-gen`'s, with no retriever: every `$ref` there is local.
jsonschema = { version = "0.52.1", default-features = false }
# Only `tests/view_params_served.rs`: the query keys a UI document's binding names, sent to both
# servers.
ess-ui.workspace = true
ess-ui-check.workspace = true
# Generated network executables are built offline by served_entry and existing synthesis tests.
# Admit the same runtime dependencies here so a clean test build populates the Cargo cache.
clap = { workspace = true, features = ["derive"] }
uuid = { version = "1.26.1", features = ["v4"] }
time = { version = "0.3.55", features = ["formatting", "parsing"] }

[lints]
workspace = true
