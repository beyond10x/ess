[package]
name = "schema-contract"
description = "Offline validation and deterministic projections for adopter-owned JSON Schema contracts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Explicit external-tool lane; selecting it requires ESS_TYPESCRIPT_COMPILER.
typescript-typecheck = []

[[test]]
name = "typescript_typecheck"
required-features = ["typescript-typecheck"]

[dependencies]
serde_json.workspace = true
thiserror.workspace = true

# The same validator and version ESS generators test their published contracts with. It is
# runtime here because adopter documents are inputs to ESS schema validation; default features
# stay off so a reference cannot turn a local gate into network I/O.
jsonschema = { version = "0.52.1", default-features = false }

[lints]
workspace = true
