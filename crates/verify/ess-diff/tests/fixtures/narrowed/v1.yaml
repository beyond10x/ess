format: ess/23
system: demo
version: v1
domain: demo.tok

types:
  - {name: demo.tok.TokenId, kind: newtype, of: String}

entities:
  - name: demo.tok.Token
    identity: {name: token_id, type: demo.tok.TokenId}
    fields:
      - {name: scope, type: String}
    lifecycle:
      initial: Active
      states: [Active]
      terminal: [Active]

actors:
  - name: demo.tok.Client
    may: [demo.tok.Present]

errors:
  - name: demo.tok.Rejected

events:
  - name: demo.tok.Presented
    fields:
      - {name: token_id, type: demo.tok.TokenId}

commands:
  - name: demo.tok.Present
    input:
      - {name: token_id, type: demo.tok.TokenId}
      - {name: scope, type: String}
    outcomes:
      - name: empty-scope
        when: scope == ""
        error: demo.tok.Rejected
      - name: accepted
        creates: demo.tok.Token
        instance: token_id
        sets: {scope: input.scope}
        emits: [demo.tok.Presented]
        payload:
          demo.tok.Presented: {token_id: input.token_id}
