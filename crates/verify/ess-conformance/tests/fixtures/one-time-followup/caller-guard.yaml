format: ess/22
system: devices
version: v1
domain: devices.api
entities:
  - name: devices.api.Device
    identity: {name: device_id, type: Uuid}
    fields:
      - {name: owner, type: String}
      - {name: nickname, type: Optional<String>}
    lifecycle:
      initial: Active
      states: [Active]
      terminal: [Active]
actors:
  - name: devices.api.Owner
    attributes:
      - {name: user_id, type: String}
    may: [devices.api.PairDevice, devices.api.RenameDevice]
  - name: devices.api.Support
    attributes:
      - {name: user_id, type: String}
    may: [devices.api.RenameDevice]
  - name: devices.api.Guest
    attributes:
      - {name: user_id, type: String}
    may: []
commands:
  - name: devices.api.PairDevice
    input:
      - {name: device_id, type: Uuid}
    response:
      - {name: pairing_code, type: String}
    outcomes:
      - name: paired
        creates: devices.api.Device
        instance: device_id
        sets: {owner: {caller: user_id}}
        returns: true
        one_time_response: [pairing_code]
        emits: [devices.api.DevicePaired]
        payload:
          devices.api.DevicePaired: {device_id: input.device_id}
  - name: devices.api.RenameDevice
    input:
      - {name: device_id, type: Uuid}
      - {name: nickname, type: String}
    outcomes:
      - {name: not-owner, when_subject: {predicate: "owner != caller.user_id"}, error: devices.api.NotOwner}
      - name: renamed
        updates: devices.api.Device
        instance: device_id
        sets: {nickname: input.nickname}
        emits: [devices.api.DeviceRenamed]
        payload:
          devices.api.DeviceRenamed: {device_id: input.device_id}
events:
  - name: devices.api.DevicePaired
    fields:
      - {name: device_id, type: Uuid}
  - name: devices.api.DeviceRenamed
    fields:
      - {name: device_id, type: Uuid}
errors:
  - name: devices.api.NotOwner
    summary: The device is paired to another caller.
    fields: []
