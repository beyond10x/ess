components:
  - component: svc
    owns:
      domains: [demo.c]
    accepts:
      commands: [demo.c.DefineGrant, demo.c.SetFlag, demo.c.OpenTicket, demo.c.SyncAll]
bindings:
  - id: sync-on-flag-set
    when:
      event: demo.c.FlagSet
    invoke:
      command: demo.c.SyncAll
    mapping:
      grant_id: event.grant_id
      flag: event.flag
    delivery: at_least_once
    on_failure: retry
