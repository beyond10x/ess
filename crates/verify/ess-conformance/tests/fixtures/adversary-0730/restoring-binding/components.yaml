components:
  - component: svc
    owns:
      domains: [demo.d]
    accepts:
      commands: [demo.d.DefineGrant, demo.d.Lower, demo.d.Raise, demo.d.Touch, demo.d.Give]
bindings:
  - id: give-on-touched
    when:
      event: demo.d.Touched
    invoke:
      command: demo.d.Give
    mapping:
      grant_id: event.grant_id
    delivery: at_least_once
    on_failure:
      drop: [missing]
      retry: {except: [missing], attempts: 3}
  - id: raise-on-lowered
    when:
      event: demo.d.Lowered
    invoke:
      command: demo.d.Raise
    mapping:
      grant_id: event.grant_id
    delivery: at_least_once
    on_failure: retry
