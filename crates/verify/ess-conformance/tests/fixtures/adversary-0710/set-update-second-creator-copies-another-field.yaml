format: ess/25
system: demo
version: v1
domain: demo.z
summary: Two commands create children; the one the filter selects copies another field of the parent.
naming: {wire: z, display: Z}
types:
  - {name: demo.z.ParentId, kind: newtype, of: Uuid}
  - {name: demo.z.ChildId, kind: newtype, of: Uuid}
entities:
  - name: demo.z.Parent
    identity: {name: parent_id, type: demo.z.ParentId}
    fields:
      - {name: flag, type: Boolean}
      - {name: mirror_flag, type: Boolean}
    lifecycle: {initial: Open, states: [Open], terminal: [Open]}
  - name: demo.z.Child
    identity: {name: child_id, type: demo.z.ChildId}
    fields:
      - {name: parent_id, type: demo.z.ParentId}
      - {name: kind, type: String}
      - {name: flag, type: Boolean}
    lifecycle: {initial: Open, states: [Open], terminal: [Open]}
actors:
  - {name: demo.z.Clerk, may: [demo.z.CreateParent, demo.z.AddChild, demo.z.AddMirror, demo.z.SyncFlag], naming: {display: Clerk}}
commands:
  - name: demo.z.CreateParent
    naming: {wire: create-parent, display: Create parent}
    input: []
    outcomes:
      - name: created
        creates: demo.z.Parent
        instance: parent_id
        emits: [demo.z.Created]
        payload: {demo.z.Created: {parent_id: {generated: true}}}
        sets: {flag: false, mirror_flag: true}
        summary: A parent is created.
  - name: demo.z.AddChild
    naming: {wire: add-child, display: Add child}
    input:
      - {name: parent_id, type: demo.z.ParentId}
    outcomes:
      - name: added
        creates: demo.z.Child
        instance: child_id
        emits: [demo.z.Added]
        payload: {demo.z.Added: {child_id: {generated: true}}}
        sets: {parent_id: input.parent_id, kind: plain, flag: {related: {via: input.parent_id, field: flag}}}
        summary: A plain child is added with its parent's flag.
  - name: demo.z.AddMirror
    naming: {wire: add-mirror, display: Add mirror}
    input:
      - {name: parent_id, type: demo.z.ParentId}
    outcomes:
      - name: added
        creates: demo.z.Child
        instance: child_id
        emits: [demo.z.Added]
        payload: {demo.z.Added: {child_id: {generated: true}}}
        sets: {parent_id: input.parent_id, kind: mirror, flag: {related: {via: input.parent_id, field: mirror_flag}}}
        summary: A mirror child is added with its parent's mirror flag.
  - name: demo.z.SyncFlag
    naming: {wire: sync-flag, display: Sync flag}
    input:
      - {name: parent_id, type: demo.z.ParentId}
    outcomes:
      - name: synced
        updates: demo.z.Child
        instances: {where: [parent_id == input.parent_id, kind == mirror]}
        emits: [demo.z.Done]
        payload: {demo.z.Done: {}}
        sets: {flag: true}
        summary: Every mirror child of the parent carries the flag.
events:
  - {name: demo.z.Created, fields: [{name: parent_id, type: demo.z.ParentId}]}
  - {name: demo.z.Added, fields: [{name: child_id, type: demo.z.ChildId}]}
  - {name: demo.z.Done, fields: []}
views:
  - name: demo.z.ChildRecord
    source: demo.z.Child
    consistency: read_your_writes
    fields:
      - {name: child_id, type: demo.z.ChildId}
      - {name: state, type: demo.z.Child.State}
      - {name: parent_id, type: demo.z.ParentId}
      - {name: kind, type: String}
      - {name: flag, type: Boolean}
    naming: {wire: child-record, display: Child record}
