format: ess/25
system: demo
version: v1
domain: demo.z
summary: Children grouped by a key, resumed when the key is poked.
naming: {wire: z, display: Z}
types:
  - {name: demo.z.Key, kind: newtype, of: Uuid}
  - {name: demo.z.ChildId, kind: newtype, of: Uuid}
entities:
  - name: demo.z.Child
    identity: {name: child_id, type: demo.z.ChildId}
    fields:
      - {name: key, type: demo.z.Key}
    lifecycle:
      initial: Held
      states: [Held, Parked]
      terminal: []
      transitions:
        - {name: park, from: [Held], to: Parked}
        - {name: resume, from: [Parked], to: Held}
actors:
  - {name: demo.z.Clerk, may: [demo.z.AddChild, demo.z.Park, demo.z.Resume, demo.z.Poke], naming: {display: Clerk}}
commands:
  - name: demo.z.AddChild
    naming: {wire: add-child, display: Add child}
    input:
      - {name: key, type: demo.z.Key}
    outcomes:
      - name: added
        creates: demo.z.Child
        instance: child_id
        emits: [demo.z.ChildAdded]
        payload:
          demo.z.ChildAdded: {child_id: {generated: true}}
        sets: {key: input.key}
        summary: A child is added.
  - name: demo.z.Park
    naming: {wire: park, display: Park}
    input:
      - {name: key, type: demo.z.Key}
    outcomes:
      - name: parked
        moves: demo.z.Child.park
        instances:
          where: key == input.key
        emits: [demo.z.Moved]
        payload:
          demo.z.Moved: {key: input.key}
        summary: Every held child under the key is parked.
  - name: demo.z.Resume
    naming: {wire: resume, display: Resume}
    input:
      - {name: key, type: demo.z.Key}
    outcomes:
      - name: resumed
        moves: demo.z.Child.resume
        instances:
          where: key == input.key
        emits: [{event: demo.z.Resumed, each: changed}]
        payload:
          demo.z.Resumed: {child_id: {changed: child_id}}
        summary: Every parked child under the key is held again, each announced.
  - name: demo.z.Poke
    naming: {wire: poke, display: Poke}
    input:
      - {name: key, type: demo.z.Key}
    outcomes:
      - name: poked
        emits: [demo.z.Poked]
        payload:
          demo.z.Poked: {key: input.key}
        summary: A key is poked.
bindings:
  - id: resume-on-poked
    when: {event: demo.z.Poked}
    invoke: {command: demo.z.Resume}
    mapping: {key: event.key}
    delivery: at_least_once
    on_failure: drop
events:
  - {name: demo.z.ChildAdded, fields: [{name: child_id, type: demo.z.ChildId}]}
  - {name: demo.z.Moved, fields: [{name: key, type: demo.z.Key}]}
  - {name: demo.z.Resumed, fields: [{name: child_id, type: demo.z.ChildId}]}
  - {name: demo.z.Poked, fields: [{name: key, type: demo.z.Key}]}
views:
  - name: demo.z.ChildRecord
    source: demo.z.Child
    consistency: read_your_writes
    fields:
      - {name: child_id, type: demo.z.ChildId}
      - {name: state, type: demo.z.Child.State}
      - {name: key, type: demo.z.Key}
    naming: {wire: child-record, display: Child record}
