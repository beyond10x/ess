# The mutation audit's survivor fixture (docs/design/mutation-audit-and-model-runner.md, P1-10).
# `examples/billing/`'s invoice context in one file, with one change: CreateInvoice sets
# `contact` from `customer_email` and takes a second address of the same type,
# `billing_email`, and no view projects `contact`. So `sets-retarget` moves the source to
# the sibling and nothing the suite reads can tell the two apart.

format: ess/1
system: billing
version: v3
domains:
  - billing.invoice

domain: billing.invoice

summary: Issuing invoices and tracking whether they are paid.

naming:
  wire: invoices
  display: Invoicing

types:
  - name: billing.invoice.InvoiceId
    kind: newtype
    of: Uuid

  - name: billing.invoice.Email
    kind: newtype
    of: String

  - name: billing.invoice.AccountId
    kind: newtype
    of: Uuid

  - name: billing.invoice.Money
    kind: struct
    fields:
      - name: amount
        type: Decimal
      - name: currency
        type: String
    invariants:
      - amount >= 0

  - name: billing.invoice.Channel
    kind: enum
    variants: [Email, Post, Portal]
    naming:
      display: Delivery channel

  - name: billing.invoice.Payee
    kind: union
    tag: kind
    variants:
      person: billing.invoice.Email
      company: billing.invoice.CompanyRef

  - name: billing.invoice.CompanyRef
    kind: newtype
    of: String

  - name: billing.invoice.LineItem
    kind: struct
    fields:
      - name: description
        type: String
      - name: quantity
        type: Integer
      - name: unit_price
        type: billing.invoice.Money

entities:
  - name: billing.invoice.Account

    identity:
      name: account_id
      type: billing.invoice.AccountId

    fields:
      - name: display_name
        type: String

    relations:
      - name: invoices
        kind: owns
        target: billing.invoice.Invoice
        cardinality: many
        via: account_id

    lifecycle:
      initial: Active
      states: [Active]
      terminal: [Active]

  - name: billing.invoice.Invoice

    identity:
      name: invoice_id
      type: billing.invoice.InvoiceId

    fields:
      - name: account_id
        type: billing.invoice.AccountId
      - name: total
        type: billing.invoice.Money
      - name: payee
        type: billing.invoice.Payee
      - name: channel
        type: billing.invoice.Channel
      - name: lines
        type: List<billing.invoice.LineItem>
      - name: note
        type: Optional<String>
      - name: metadata
        type: Map<String, String>
      - name: issued_at
        type: Optional<Timestamp>
      - name: settlement_window
        type: Duration
      - name: is_recurring
        type: Boolean
      - name: signature
        type: Bytes
      - name: reminder_count
        type: Integer
      - name: contact
        type: billing.invoice.Email

    invariants:
      - total.amount >= 0
      - reminder_count >= 0

    lifecycle:
      initial: Draft
      states: [Draft, Issued, Paid, Cancelled]
      terminal: [Paid, Cancelled]
      transitions:
        - name: issue
          from: [Draft]
          to: Issued
        - name: settle
          from: [Issued]
          to: Paid
        - name: cancel
          from: [Draft, Issued]
          to: Cancelled

actors:
  - name: billing.invoice.Customer
    may:
      - billing.invoice.CreateInvoice
    naming:
      display: Customer

  - name: billing.invoice.Auditor

errors:
  - name: billing.invoice.InvalidAmount
    summary: The requested amount is not positive.
    fields:
      - name: submitted
        type: billing.invoice.Money

  - name: billing.invoice.InvoiceStateConflict
    summary: The invoice is not in a state this command acts from, so nothing moved.
    fields:
      - name: state
        type: billing.invoice.Invoice.State

commands:
  - name: billing.invoice.CreateInvoice

    naming:
      wire: create-invoice
      display: Create invoice

    input:
      - name: account_id
        type: billing.invoice.AccountId
      - name: customer_email
        type: billing.invoice.Email
      - name: amount
        type: billing.invoice.Money
      - name: billing_email
        type: billing.invoice.Email

    outcomes:
      - name: accepted
        when: amount.amount > 0
        creates: billing.invoice.Invoice
        instance: invoice_id
        emits:
          - billing.invoice.InvoiceCreated
        payload:
          billing.invoice.InvoiceCreated:
            account_id: input.account_id
            customer_email: input.customer_email
            amount: input.amount
        sets:
          account_id: input.account_id
          total: input.amount
          reminder_count: "0"
          contact: input.customer_email
        summary: The invoice is created in Draft.

      - name: rejected
        error: billing.invoice.InvalidAmount
        summary: The amount was not positive, and nothing was created.

  - name: billing.invoice.IssueInvoice

    naming:
      wire: issue-invoice
      display: Issue invoice

    input:
      - name: invoice_id
        type: billing.invoice.InvoiceId

    outcomes:
      - name: issued
        moves: billing.invoice.Invoice.issue
        instance: invoice_id
        emits:
          - billing.invoice.InvoiceIssued
        payload:
          billing.invoice.InvoiceIssued:
            invoice_id: input.invoice_id
        summary: The invoice leaves Draft and is now Issued.

      - name: wrong-state
        wrong_state: true
        error: billing.invoice.InvoiceStateConflict
        summary: The invoice is not in Draft, so it was not issued.

  - name: billing.invoice.PayInvoice

    naming:
      wire: pay-invoice
      display: Pay invoice

    input:
      - name: invoice_id
        type: billing.invoice.InvoiceId
      - name: amount
        type: billing.invoice.Money

    outcomes:
      - name: settled
        when: amount.amount > 0
        moves: billing.invoice.Invoice.settle
        instance: invoice_id
        emits:
          - billing.invoice.InvoicePaid
        payload:
          billing.invoice.InvoicePaid:
            invoice_id: input.invoice_id
            amount: input.amount
        summary: The payment is accepted and the invoice becomes Paid.

      - name: rejected
        error: billing.invoice.InvalidAmount
        summary: The payment was not positive, so the invoice did not move.

      - name: wrong-state
        wrong_state: true
        error: billing.invoice.InvoiceStateConflict
        summary: The invoice is not Issued, so the payment did not settle it.

  - name: billing.invoice.CancelInvoice

    naming:
      wire: cancel-invoice
      display: Cancel invoice

    input:
      - name: invoice_id
        type: billing.invoice.InvoiceId

    outcomes:
      - name: cancelled
        moves: billing.invoice.Invoice.cancel
        instance: invoice_id
        emits:
          - billing.invoice.InvoiceCancelled
        payload:
          billing.invoice.InvoiceCancelled:
            invoice_id: input.invoice_id
        summary: The invoice is cancelled, from Draft or from Issued.

      - name: wrong-state
        wrong_state: true
        error: billing.invoice.InvoiceStateConflict
        summary: The invoice is already Paid or already Cancelled, so nothing was cancelled.

events:
  - name: billing.invoice.InvoiceCreated
    fields:
      - name: invoice_id
        type: billing.invoice.InvoiceId
      - name: account_id
        type: billing.invoice.AccountId
      - name: customer_email
        type: billing.invoice.Email
      - name: amount
        type: billing.invoice.Money

  - name: billing.invoice.InvoiceIssued
    fields:
      - name: invoice_id
        type: billing.invoice.InvoiceId

  - name: billing.invoice.InvoicePaid
    fields:
      - name: invoice_id
        type: billing.invoice.InvoiceId
      - name: amount
        type: billing.invoice.Money

  - name: billing.invoice.InvoiceCancelled
    fields:
      - name: invoice_id
        type: billing.invoice.InvoiceId

views:
  - name: billing.invoice.InvoiceById
    source: billing.invoice.Invoice
    consistency: eventual
    fields:
      - name: invoice_id
        type: billing.invoice.InvoiceId
      - name: total
        type: billing.invoice.Money
      - name: reminder_count
        type: Integer

  - name: billing.invoice.OutstandingInvoices
    source: billing.invoice.Invoice
    consistency: read_your_writes
    filter: state == Issued
    order_by:
      - issued_at desc
    fields:
      - name: invoice_id
        type: billing.invoice.InvoiceId
      - name: total
        type: billing.invoice.Money
      - name: issued_at
        type: Optional<Timestamp>
    naming:
      wire: outstanding
      display: Outstanding invoices
