format: ess/25
system: demo
version: v1
domain: demo.w
summary: Rows a reset deletes, created only behind a not-found branch that emits an event.

types:
  - name: demo.w.MemberId
    kind: newtype
    of: Uuid
  - name: demo.w.TicketId
    kind: newtype
    of: String

entities:
  - name: demo.w.Member
    identity:
      name: member_id
      type: demo.w.MemberId
    lifecycle:
      initial: Active
      states: [Active]
      terminal: [Active]

  - name: demo.w.Ticket
    identity:
      name: ticket_id
      type: demo.w.TicketId
    fields:
      - name: member_id
        type: demo.w.MemberId
    lifecycle:
      initial: Open
      states: [Open]
      terminal: [Open]

actors:
  - name: demo.w.Admin
    may: [demo.w.CreateMember, demo.w.OpenTicket, demo.w.ResetMember]

errors:
  - name: demo.w.MemberNotFound

commands:
  - name: demo.w.CreateMember
    outcomes:
      - name: created
        creates: demo.w.Member
        instance: member_id
        emits: [demo.w.MemberEvent]
        payload:
          demo.w.MemberEvent:
            member_id: {generated: true}

  - name: demo.w.OpenTicket
    input:
      - name: member_id
        type: demo.w.MemberId
    outcomes:
      - name: not-found
        when_related: {via: input.member_id, exists: false}
        emits: [demo.w.Missed]
      - name: opened
        creates: demo.w.Ticket
        instance: ticket_id
        emits: [demo.w.TicketOpened]
        payload:
          demo.w.TicketOpened:
            ticket_id: {generated: true}
        sets:
          member_id: input.member_id

  - name: demo.w.ResetMember
    input:
      - name: member_id
        type: demo.w.MemberId
    outcomes:
      - name: reset
        updates: demo.w.Member
        instance: member_id
        emits: [demo.w.MemberEvent]
        payload:
          demo.w.MemberEvent:
            member_id: input.member_id
        affects:
          - entity: demo.w.Ticket
            where: member_id == input.member_id
            deletes: demo.w.Ticket

events:
  - name: demo.w.Missed
    fields: []
  - name: demo.w.MemberEvent
    fields:
      - name: member_id
        type: demo.w.MemberId
  - name: demo.w.TicketOpened
    fields:
      - name: ticket_id
        type: demo.w.TicketId

views:
  - name: demo.w.TicketRecord
    source: demo.w.Ticket
    consistency: read_your_writes
    fields:
      - name: ticket_id
        type: demo.w.TicketId
      - name: state
        type: demo.w.Ticket.State
      - name: member_id
        type: demo.w.MemberId
