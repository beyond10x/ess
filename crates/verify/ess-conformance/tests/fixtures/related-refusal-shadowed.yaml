format: ess/19
system: parcels
version: v1
domain: parcels.locker
summary: Lockers at a site, and the parcels dropped in them; two refusals read the same closed locker.
types:
  - {name: parcels.locker.LockerId, kind: newtype, of: Uuid}
  - {name: parcels.locker.ParcelCode, kind: newtype, of: String}
entities:
  - name: parcels.locker.Locker
    identity: {name: locker_id, type: parcels.locker.LockerId}
    fields:
      - {name: site, type: String}
      - {name: accepting, type: Boolean}
    lifecycle: {initial: Active, states: [Active], terminal: [Active]}
  - name: parcels.locker.Parcel
    identity: {name: parcel_code, type: parcels.locker.ParcelCode}
    fields:
      - {name: locker_id, type: parcels.locker.LockerId}
      - {name: recipient, type: String}
    relations:
      - {name: locker, kind: references, target: parcels.locker.Locker, cardinality: one, via: locker_id}
    lifecycle: {initial: Stored, states: [Stored], terminal: [Stored]}
actors:
  - name: parcels.locker.Courier
    may: [parcels.locker.InstallLocker, parcels.locker.CloseLocker, parcels.locker.DropParcel]
errors:
  - {name: parcels.locker.NoSuchLocker, summary: No locker carries this identity., fields: []}
  - {name: parcels.locker.LockerNotAccepting, summary: The locker is closed to new parcels., fields: []}
  - {name: parcels.locker.LockerShut, summary: The locker is shut for maintenance., fields: []}
  - {name: parcels.locker.LockerFull, summary: The locker at the depot is closed and full., fields: []}
  - {name: parcels.locker.LockerAtDepot, summary: The locker stands at the depot., fields: []}
  - {name: parcels.locker.StaffLockerClosed, summary: Staff parcels go to the depot while the locker is closed., fields: []}
commands:
  - name: parcels.locker.InstallLocker
    input:
      - {name: site, type: String, example: North Station}
    outcomes:
      - name: installed
        creates: parcels.locker.Locker
        instance: locker_id
        sets: {site: input.site, accepting: true}
        emits: [parcels.locker.LockerInstalled]
        payload:
          parcels.locker.LockerInstalled: {locker_id: {generated: true}, site: input.site}
  - name: parcels.locker.CloseLocker
    input:
      - {name: locker_id, type: parcels.locker.LockerId}
    outcomes:
      - name: closed
        updates: parcels.locker.Locker
        instance: locker_id
        sets: {accepting: false}
        emits: [parcels.locker.LockerClosed]
        payload:
          parcels.locker.LockerClosed: {locker_id: input.locker_id}
      - {name: no-such-locker, unknown_instance: true, error: parcels.locker.NoSuchLocker}
  - name: parcels.locker.DropParcel
    input:
      - {name: parcel_code, type: parcels.locker.ParcelCode}
      - {name: locker_id, type: parcels.locker.LockerId}
      - {name: recipient, type: String}
    outcomes:
      - name: no-locker
        when_related: {via: input.locker_id, exists: false}
        error: parcels.locker.NoSuchLocker
      - name: staff-closed
        when_related: {via: input.locker_id, predicate: accepting == false}
        when: recipient == staff
        error: parcels.locker.StaffLockerClosed
      - name: locker-closed
        when_related: {via: input.locker_id, predicate: accepting == false}
        error: parcels.locker.LockerNotAccepting
      - name: locker-shut
        when_related: {via: input.locker_id, predicate: accepting == false}
        error: parcels.locker.LockerShut
      - name: locker-full
        when_related: {via: input.locker_id, predicate: {all: [accepting == false, site == Depot]}}
        error: parcels.locker.LockerFull
      - name: at-depot
        when_related: {via: input.locker_id, predicate: site == Depot}
        error: parcels.locker.LockerAtDepot
      - name: dropped
        creates: parcels.locker.Parcel
        instance: parcel_code
        sets: {locker_id: input.locker_id, recipient: input.recipient}
        emits: [parcels.locker.ParcelDeposited]
        payload:
          parcels.locker.ParcelDeposited: {parcel_code: input.parcel_code, locker_id: input.locker_id}
events:
  - name: parcels.locker.LockerInstalled
    fields:
      - {name: locker_id, type: parcels.locker.LockerId}
      - {name: site, type: String}
  - name: parcels.locker.LockerClosed
    fields:
      - {name: locker_id, type: parcels.locker.LockerId}
  - name: parcels.locker.ParcelDeposited
    fields:
      - {name: parcel_code, type: parcels.locker.ParcelCode}
      - {name: locker_id, type: parcels.locker.LockerId}
views:
  - name: parcels.locker.Parcels
    source: parcels.locker.Parcel
    consistency: read_your_writes
    fields:
      - {name: parcel_code, type: parcels.locker.ParcelCode}
      - {name: locker_id, type: parcels.locker.LockerId}
      - {name: recipient, type: String}
