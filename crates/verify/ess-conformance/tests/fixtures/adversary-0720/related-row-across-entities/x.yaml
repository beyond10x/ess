domain: demo.x
types:
  - {name: demo.x.GroupId, kind: newtype, of: String}
  - {name: demo.x.TeamId, kind: newtype, of: String}
entities:
  - name: demo.x.Group
    identity: {name: group_id, type: demo.x.GroupId}
    lifecycle: {initial: Active, states: [Active], terminal: [Active]}
  - name: demo.x.Team
    identity: {name: team_id, type: demo.x.TeamId}
    lifecycle: {initial: Active, states: [Active], terminal: [Active]}
commands:
  - name: demo.x.DefineGroup
    input: []
    outcomes:
      - name: defined
        creates: demo.x.Group
        instance: group_id
        emits: [demo.x.GroupDefined]
        payload:
          demo.x.GroupDefined: {group_id: {generated: true}}
  - name: demo.x.DefineTeam
    input: []
    outcomes:
      - name: defined
        creates: demo.x.Team
        instance: team_id
        emits: [demo.x.TeamDefined]
        payload:
          demo.x.TeamDefined: {team_id: {generated: true}}
  - name: demo.x.Enrol
    input:
      - {name: team_id, type: demo.x.TeamId}
    outcomes:
      - {name: no-team, when_related: {via: input.team_id, exists: false}, error: demo.x.TeamMissing}
      - name: enrolled
        emits: [demo.x.Enrolled]
        payload:
          demo.x.Enrolled: {team_id: input.team_id}
  - name: demo.x.Grant
    input:
      - {name: group_id, type: demo.x.GroupId}
    outcomes:
      - name: group-missing
        when_related: {via: input.group_id, exists: false}
        error: demo.x.GroupMissing
      - name: granted
        emits: [demo.x.Granted]
        payload:
          demo.x.Granted: {group_id: input.group_id}
errors:
  - name: demo.x.GroupMissing
  - name: demo.x.TeamMissing
events:
  - name: demo.x.GroupDefined
    fields:
      - {name: group_id, type: demo.x.GroupId}
  - name: demo.x.TeamDefined
    fields:
      - {name: team_id, type: demo.x.TeamId}
  - name: demo.x.Enrolled
    fields:
      - {name: team_id, type: demo.x.TeamId}
  - name: demo.x.Granted
    fields:
      - {name: group_id, type: demo.x.GroupId}
conversions:
  - from: demo.x.TeamId
    to: demo.x.GroupId
    because: A team is enrolled into the group of the same name.
