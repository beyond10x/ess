domain: demo.a
types:
  - {name: demo.a.SeatId, kind: newtype, of: Uuid}
  - {name: demo.a.HolderId, kind: newtype, of: Uuid}
entities:
  - name: demo.a.Holder
    identity: {name: holder_id, type: demo.a.HolderId}
    lifecycle: {initial: Active, states: [Active], terminal: [Active]}
  - name: demo.a.Seat
    identity: {name: seat_id, type: demo.a.SeatId}
    fields:
      - {name: holder_id, type: demo.a.HolderId}
    lifecycle: {initial: Open, states: [Open], terminal: [Open]}
commands:
  - name: demo.a.Register
    input: []
    outcomes:
      - name: registered
        creates: demo.a.Holder
        instance: holder_id
        emits: [demo.a.Registered]
        payload:
          demo.a.Registered: {holder_id: {generated: true}}
  - name: demo.a.AddSeat
    input:
      - {name: holder_id, type: demo.a.HolderId}
    outcomes:
      - name: added
        creates: demo.a.Seat
        instance: seat_id
        emits: [demo.a.SeatAdded]
        payload:
          demo.a.SeatAdded: {seat_id: {generated: true}}
        sets:
          holder_id: input.holder_id
  - name: demo.a.Request
    input:
      - {name: holder_id, type: demo.a.HolderId}
    outcomes:
      - name: no-holder
        when_related: {via: input.holder_id, exists: false}
        error: demo.a.HolderMissing
      - name: requested
        emits: [demo.a.Requested]
        payload:
          demo.a.Requested: {holder_id: input.holder_id}
  - name: demo.a.Check
    input:
      - {name: holder_id, type: demo.a.HolderId}
    outcomes:
      - name: unavailable
        external: the store cannot be written to
        error: demo.a.Unavailable
      - name: kept
        when_related: {entity: demo.a.Seat, where: holder_id == input.holder_id, exists: true}
        emits: [demo.a.Kept]
        payload:
          demo.a.Kept: {holder_id: input.holder_id}
      - name: dropped
        emits: [demo.a.Dropped]
        payload:
          demo.a.Dropped: {holder_id: input.holder_id}
errors:
  - name: demo.a.Unavailable
  - name: demo.a.HolderMissing
events:
  - name: demo.a.Registered
    fields:
      - {name: holder_id, type: demo.a.HolderId}
  - name: demo.a.SeatAdded
    fields:
      - {name: seat_id, type: demo.a.SeatId}
  - name: demo.a.Requested
    fields:
      - {name: holder_id, type: demo.a.HolderId}
  - name: demo.a.Kept
    fields:
      - {name: holder_id, type: demo.a.HolderId}
  - name: demo.a.Dropped
    fields:
      - {name: holder_id, type: demo.a.HolderId}
