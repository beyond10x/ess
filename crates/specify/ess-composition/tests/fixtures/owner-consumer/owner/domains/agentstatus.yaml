domain: demo.owner.agentstatus

types:
  - name: demo.owner.agentstatus.AgentId
    kind: newtype
    of: Uuid
  - name: demo.owner.agentstatus.Availability
    kind: enum
    variants: [Online, Away]
  - name: demo.owner.agentstatus.StatusView
    kind: struct
    fields:
      - { name: agent_id, type: demo.owner.agentstatus.AgentId }
      - { name: availability, type: demo.owner.agentstatus.Availability }
      - { name: note, type: Optional<String> }
      - { name: since, type: Timestamp }
  - name: demo.owner.agentstatus.CallId
    kind: newtype
    of: String
  - name: demo.owner.agentstatus.CallRef
    kind: newtype
    of: demo.owner.agentstatus.CallId
  - name: demo.owner.agentstatus.CallState
    kind: enum
    variants:
      - in_call
      - ringing
  - name: demo.owner.agentstatus.CallIdView
    kind: struct
    fields:
      - { name: call_id, type: demo.owner.agentstatus.CallRef }
  - name: demo.owner.agentstatus.CallStateView
    kind: struct
    fields:
      - { name: state, type: demo.owner.agentstatus.CallState }
      - { name: previous, type: Optional<demo.owner.agentstatus.CallState> }
  - name: demo.owner.agentstatus.ContextView
    kind: struct
    fields:
      - { name: body, type: Json }
  - name: demo.owner.agentstatus.ObjectView
    kind: struct
    fields:
      - { name: body, type: demo.owner.agentstatus.CallIdView }
      - { name: labels, type: "Map<String, String>" }

entities:
  - name: demo.owner.agentstatus.AgentStatus
    identity: { name: agent_id, type: demo.owner.agentstatus.AgentId }
    fields:
      - { name: availability, type: demo.owner.agentstatus.Availability }
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

commands:
  - name: demo.owner.agentstatus.UpdateOwnStatus
    input:
      - { name: availability, type: demo.owner.agentstatus.Availability }
    outcomes:
      - name: updated
        creates: demo.owner.agentstatus.AgentStatus
        instance: agent_id
        emits: [demo.owner.agentstatus.StatusUpdated]
        payload:
          demo.owner.agentstatus.StatusUpdated:
            availability: input.availability
            agent_id: { generated: true }

events:
  - name: demo.owner.agentstatus.StatusUpdated
    fields:
      - { name: agent_id, type: demo.owner.agentstatus.AgentId }
      - { name: availability, type: demo.owner.agentstatus.Availability }
