format: ess/23
system: demo
version: v1

domains:
  - demo.gate
  - demo.audit
  - demo.loose

# `demo.loose` is owned by no component.
components:
  - component: relay
    owns:
      domains:
        - demo.gate
    accepts:
      commands:
        - demo.gate.Admit
    publishes:
      events:
        - demo.gate.Admitted
    reached_by: network
  - component: auditor
    owns:
      domains:
        - demo.audit
    accepts:
      commands:
        - demo.audit.Record
    publishes:
      events:
        - demo.audit.Flagged
    reached_by: network
