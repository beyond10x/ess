domain: wire.server

types:
  - name: wire.server.Channel
    kind: newtype
    of: String

actors:
  - name: wire.server.Client
    may:
      - wire.server.Subscribe

commands:
  # The contract command: a required input and an `Optional` one.
  - name: wire.server.Subscribe
    input:
      - name: channel
        type: wire.server.Channel
      - name: note
        type: Optional<String>
    outcomes:
      - name: subscribed
        emits:
          - wire.server.Subscribed
        payload:
          wire.server.Subscribed:
            channel: input.channel

events:
  - name: wire.server.Subscribed
    fields:
      - name: channel
        type: wire.server.Channel
