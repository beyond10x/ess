format: ess/23
system: demo
version: v1

domains:
  - demo.gate
  - demo.audit

components:
  - component: relay
    owns:
      domains:
        - demo.gate
    accepts:
      commands:
        - demo.gate.Admit
        - demo.gate.Answer
        - demo.gate.Count
        - demo.gate.Bare
        - demo.gate.Insist
    publishes:
      events:
        - demo.gate.Admitted
    reached_by: network
  - component: auditor
    owns:
      domains:
        - demo.audit
    accepts:
      commands:
        - demo.audit.Record
    reached_by: network
