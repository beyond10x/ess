format: ess/1
system: shop
version: v1
domains: [shop.repeat]
domain: shop.repeat
events:
  - name: shop.repeat.Filed
    fields:
      - name: note
        type: String
commands:
  - name: shop.repeat.File
    input:
      - name: note
        type: String
      - name: note
        type: String
    outcomes:
      - name: filed
        emits:
          - shop.repeat.Missing
      - name: filed
        error: shop.repeat.Absent
  - name: shop.repeat.FileTwo
    input:
      - name: note
        type: String
    outcomes:
      - name: filed
        emits:
          - shop.repeat.Filed
        payload:
          shop.repeat.Filed:
            note: input.note
  - name: shop.repeat.Solo
    input:
      - name: note
        type: String
    outcomes:
      - name: noted
        emits:
          - shop.repeat.Filed
        payload:
          shop.repeat.Filed:
            note: input.note
      - name: noted
        emits:
          - shop.repeat.Filed
