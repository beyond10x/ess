format: ess/22
system: shop
version: v1
domain: shop.order
types:
  - {name: shop.order.OrderId, kind: newtype, of: Uuid}
entities:
  - name: shop.order.Order
    identity: {name: order_id, type: shop.order.OrderId}
    fields:
      - {name: failure, type: Optional<String>}
    lifecycle:
      initial: Idle
      states: [Idle, Joined, Offline]
      terminal: [Offline]
      transitions:
        - {name: join, from: [Idle], to: Joined}
        - {name: reset, from: [Idle, Joined], to: Offline}
actors:
  - {name: shop.order.Clerk, may: [shop.order.PlaceOrder, shop.order.JoinOrder]}
errors:
  - name: shop.order.Refused
    summary: The upstream refused the join.
    fields: []
  - name: shop.order.Closed
    summary: The order rests in a state no join starts from.
    fields: []
commands:
  - name: shop.order.PlaceOrder
    input: []
    outcomes:
      - name: placed
        creates: shop.order.Order
        instance: order_id
        emits: [shop.order.OrderPlaced]
        payload:
          shop.order.OrderPlaced: {order_id: {generated: true}}
  - name: shop.order.JoinOrder
    input:
      - {name: order_id, type: shop.order.OrderId}
      - {name: reason, type: String}
    outcomes:
      - name: joined
        moves: shop.order.Order.join
        instance: order_id
        emits: [shop.order.OrderJoined]
        payload:
          shop.order.OrderJoined: {order_id: input.order_id}
      - name: failed
        external: the upstream refuses the join
        error: shop.order.Refused
        compensates: true
        moves: shop.order.Order.reset
        instance: order_id
        sets: {failure: input.reason}
      - name: closed
        wrong_state: true
        error: shop.order.Closed
events:
  - name: shop.order.OrderPlaced
    fields:
      - {name: order_id, type: shop.order.OrderId}
  - name: shop.order.OrderJoined
    fields:
      - {name: order_id, type: shop.order.OrderId}
views:
  - name: shop.order.Orders
    source: shop.order.Order
    consistency: read_your_writes
    fields:
      - {name: order_id, type: shop.order.OrderId}
      - {name: state, type: shop.order.Order.State}
      - {name: failure, type: Optional<String>}
components:
  - component: order-service
    owns: {domains: [shop.order]}
    accepts: {commands: [shop.order.PlaceOrder, shop.order.JoinOrder]}
    publishes: {events: [shop.order.OrderPlaced, shop.order.OrderJoined]}
    reached_by: network
