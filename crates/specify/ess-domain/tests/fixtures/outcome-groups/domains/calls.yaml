domain: desk.calls
summary: Calls, placed and held by a remote service.
events:
  - name: desk.calls.CallHeld
    fields: [{name: call_id, type: Uuid}]
  - name: desk.calls.CallResumed
    fields: [{name: call_id, type: Uuid}]
  - name: desk.calls.CallParked
    fields: [{name: call_id, type: Uuid}]
  - name: desk.calls.CallDialled
    fields: [{name: call_id, type: Uuid}]
commands:
  - name: desk.calls.Hold
    input: [{name: call_id, type: Uuid}]
    outcomes:
      - name: held
        emits: [desk.calls.CallHeld]
        payload:
          desk.calls.CallHeld:
            call_id: input.call_id
  - name: desk.calls.Resume
    input: [{name: call_id, type: Uuid}]
    outcomes:
      - name: resumed
        emits: [desk.calls.CallResumed]
        payload:
          desk.calls.CallResumed:
            call_id: input.call_id
  - name: desk.calls.Park
    input: [{name: call_id, type: Uuid}]
    outcomes:
      - name: parked
        emits: [desk.calls.CallParked]
        payload:
          desk.calls.CallParked:
            call_id: input.call_id
      - name: credential-rejected
        external: the parking service reports the session expired
        error: desk.session.Expired
  - name: desk.calls.Dial
    input: [{name: call_id, type: Uuid}]
    outcomes:
      - name: dialled
        emits: [desk.calls.CallDialled]
        payload:
          desk.calls.CallDialled:
            call_id: input.call_id
actors:
  - name: desk.calls.Agent
    may: [desk.calls.Hold, desk.calls.Resume, desk.calls.Park]
  - name: desk.calls.Supervisor
    may: [desk.calls.Dial]
outcome_groups:
  - name: remote-backed
    actor: desk.calls.Agent
    except: [desk.calls.Park]
    outcomes:
      - name: credential-rejected
        external: the service rejects the session credential
        error: desk.session.Unauthenticated
        summary: The remote service refused the session.
        refs: [issue:beyond10x/ess#105]
