[package]
name = "ess-domain"
description = "Typed model for an Executable System Specification (ESS)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
ess-primitives.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
schemars.workspace = true
thiserror.workspace = true

[[test]]
name = "billing"
path = "tests/billing.rs"

[dev-dependencies]
# `tests/serialized_string_schema.rs` validates serialized values against the committed document
# schema with a conforming validator, which is what makes `pattern` checked. Already in the
# workspace: same version and spelling as `ess-gen` and `schema-contract`, so one validator
# behaviour across the workspace and no new entry in the lock file. `default-features = false` drops
# the HTTP and file retrievers; every `$ref` the document schema emits is a same-document pointer.
jsonschema = { version = "0.52.1", default-features = false }

[lints]
workspace = true
